<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bio Link</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #090a0f;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* Canvas hiệu ứng Tuyết va chạm */
    #snow-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Màn hình Click to Enter */
    #enter-screen {
      position: fixed;
      inset: 0;
      background: rgba(9, 10, 15, 0.95);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    #enter-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .enter-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #e4e4e7;
      text-transform: uppercase;
      animation: pulseText 2s infinite ease-in-out;
    }

    @keyframes pulseText {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    /* Card giao diện chính */
    .card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      background: rgba(18, 19, 26, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      overflow: hidden;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  inset 0 1px 0 rgba(255, 255, 255, 0.1);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Banner Ảnh Bìa Video MP4 (anhbia.mp4) & Gradient mờ chiều sâu */
    .banner-container {
      position: relative;
      width: 100%;
      height: 160px;
    }

    .banner {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(18, 19, 26, 0) 0%, rgba(18, 19, 26, 0.8) 70%, rgba(18, 19, 26, 1) 100%);
    }

    /* Bố cục Avatar GIF thò 1/2 vào ảnh bìa */
    .avatar-wrapper {
      position: relative;
      width: 100px;
      height: 100px;
      margin: -50px auto 16px;
      z-index: 3;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    /* Tiêu đề & Tích xanh kế bên */
    .card-body {
      padding: 0 28px 36px;
    }

    .name-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
    }

    .badge-inline {
      background: #6366f1;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.8);
      animation: badgePulse 2s infinite ease-in-out;
    }

    @keyframes badgePulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(99, 102, 241, 0.6); }
      50% { transform: scale(1.15); box-shadow: 0 0 16px rgba(99, 102, 241, 0.9); }
    }

    .bio {
      font-size: 14px;
      color: #a1a1aa;
      margin-bottom: 28px;
      line-height: 1.6;
      font-weight: 400;
    }

    /* Các nút mạng xã hội */
    .socials {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #d4d4d8;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 18px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.3);
    }

    /* Danh sách Link / File Share */
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #ffffff;
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .link-icon {
      font-size: 18px;
      color: #818cf8;
      width: 20px;
      text-align: center;
    }

    .arrow-icon {
      font-size: 12px;
      color: #52525b;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .link-item:hover .arrow-icon {
      color: #a1a1aa;
      transform: translate(2px, -2px);
    }

    /* Footer */
    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #52525b;
    }
  </style>
</head>
<body>

  <!-- Canvas Tuyết -->
  <canvas id="snow-canvas"></canvas>

  <!-- Màn hình Click to Enter -->
  <div id="enter-screen" onclick="enterSite()">
    <div class="enter-text">[ Click to enter ]</div>
  </div>

  <!-- Card Giao diện -->
  <div class="card">
    <!-- Video Ảnh Bìa MP4 (Đã tắt âm thanh) -->
    <div class="banner-container">
      <video class="banner" autoplay loop muted playsinline>
        <source src="anhbia.mp4" type="video/mp4" />
      </video>
      <div class="banner-overlay"></div>
    </div>

    <!-- Avatar GIF (Giữ nguyên) -->
    <div class="avatar-wrapper">
      <img src="avatar.gif" alt="Avatar" class="avatar" />
    </div>

    <div class="card-body">
      <!-- Tên kèm Tích xanh chuyển động bên cạnh -->
      <div class="name-wrapper">
        <h1 class="name">DigitalXiao</h1>
        <div class="badge-inline" title="Verified"><i class="fa-solid fa-check"></i></div>
      </div>

      <p class="bio">Developer & Modder • Web Creator & Android Customization</p>

      <!-- Icon Mạng Xã Hội -->
      <div class="socials">
        <a href="https://telegram.org" target="_blank" class="social-btn" title="Telegram">
          <i class="fa-brands fa-telegram"></i>
        </a>
        <a href="https://github.com" target="_blank" class="social-btn" title="GitHub">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://facebook.com" target="_blank" class="social-btn" title="Facebook">
          <i class="fa-brands fa-facebook"></i>
        </a>
        <a href="https://discord.com" target="_blank" class="social-btn" title="Discord">
          <i class="fa-brands fa-discord"></i>
        </a>
      </div>

      <!-- Danh Sách Link / File Share -->
      <div class="links-list">
        <a href="#" target="_blank" class="link-item">
          <div class="link-info">
            <i class="fa-solid fa-download link-icon"></i>
            <span>Tải File Custom ROM / Mod</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        </a>

        <a href="#" target="_blank" class="link-item">
          <div class="link-info">
            <i class="fa-solid fa-code link-icon"></i>
            <span>Project Web Interface</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        </a>

        <a href="#" target="_blank" class="link-item">
          <div class="link-info">
            <i class="fa-solid fa-layer-group link-icon"></i>
            <span>Kênh Cập Nhật Telegram</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        </a>

        <a href="#" target="_blank" class="link-item">
          <div class="link-info">
            <i class="fa-solid fa-globe link-icon"></i>
            <span>Trang Chủ DigitalsMod</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square arrow-icon"></i>
        </a>
      </div>

      <div class="footer">
        © 2026 DigitalXiao. All rights reserved.
      </div>
    </div>
  </div>

  <script>
    // Hàm Click to Enter
    function enterSite() {
      document.getElementById('enter-screen').classList.add('hidden');
    }

    // Canvas Hiệu Ứng Tuyết Bật Tường (Physics Snow)
    const canvas = document.getElementById('snow-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const maxFlakes = 500;
    const flakes = [];

    class Flake {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 2 + 1;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = Math.random() * 1 + 0.5;
        this.alpha = Math.random() * 0.7 + 0.3;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x - this.radius <= 0) {
          this.x = this.radius;
          this.vx *= -1;
        } else if (this.x + this.radius >= width) {
          this.x = width - this.radius;
          this.vx *= -1;
        }

        if (this.y - this.radius <= 0) {
          this.y = this.radius;
          this.vy *= -1;
        } else if (this.y + this.radius >= height) {
          this.y = height - this.radius;
          this.vy *= -1;
        }
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < maxFlakes; i++) {
      flakes.push(new Flake());
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      for (let i = 0; i < maxFlakes; i++) {
        flakes[i].update();
        flakes[i].draw();
      }
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
