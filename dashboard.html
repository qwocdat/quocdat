<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Linkora Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
input,button,select,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;-webkit-appearance:none;border-radius:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse;width:100%}
:root{
  --bg:#fff;--bg-soft:#fafafa;--bg-sunken:#f4f4f5;--text:#111;--text-2:#666;--text-3:#9a9a9a;
  --border:rgba(0,0,0,.08);--border-2:rgba(0,0,0,.14);--card:#fff;
  --accent:#2563eb;--accent-soft:rgba(37,99,235,.08);
  --ok:#059669;--ok-soft:rgba(5,150,105,.10);
  --warn:#b45309;--warn-soft:rgba(180,83,9,.10);
  --danger:#dc2626;--danger-soft:rgba(220,38,38,.09);
  --shadow-sm:0 2px 8px rgba(0,0,0,.05);--shadow:0 8px 32px rgba(0,0,0,.07);
  --r:16px;--r-lg:22px;--sidebar:250px;
}
[data-theme="dark"]{
  --bg:#0a0a0a;--bg-soft:#101010;--bg-sunken:#151515;--text:#f5f5f5;--text-2:#a3a3a3;--text-3:#6b6b6b;
  --border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.18);--card:#101010;
  --accent:#3b82f6;--accent-soft:rgba(59,130,246,.14);
  --ok:#34d399;--ok-soft:rgba(52,211,153,.12);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);
  --danger:#f87171;--danger-soft:rgba(248,113,113,.12);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px}
h1,h2,h3{letter-spacing:-0.02em;font-weight:700}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1rem}
.small{font-size:.82rem}.tiny{font-size:.74rem}
.muted{color:var(--text-2)}.muted-3{color:var(--text-3)}
.mono{font-family:'SF Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.wrap{flex-wrap:wrap}.hidden{display:none!important}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:12px;font-size:.85rem;font-weight:600;background:var(--text);color:var(--bg);border:1px solid transparent;transition:transform .15s,opacity .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border-2)}
.btn.soft{background:var(--bg-sunken);color:var(--text);border-color:var(--border)}
.btn.accent{background:var(--accent);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.ok{background:var(--ok);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:.78rem;border-radius:9px}
.btn.xs{height:26px;padding:0 9px;font-size:.72rem;border-radius:7px}
.btn.block{width:100%}

.input,.select,.textarea{width:100%;height:42px;padding:0 13px;background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;font-size:.88rem}
.textarea{height:auto;min-height:100px;padding:12px 13px;line-height:1.5;resize:vertical}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:36px;cursor:pointer}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 4px var(--accent-soft)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:.78rem;font-weight:600;color:var(--text-2)}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.card-title{font-size:.92rem;font-weight:650}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.stat-value{font-size:1.5rem;font-weight:750;letter-spacing:-0.03em}
.stat-label{font-size:.72rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}

.grid{display:grid;gap:14px}
.grid.c2{grid-template-columns:repeat(2,1fr)}
.grid.c3{grid-template-columns:repeat(3,1fr)}
.grid.c4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}

.badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:7px;font-size:.7rem;font-weight:650;background:var(--bg-sunken);color:var(--text-2);border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table th{text-align:left;font-size:.7rem;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);padding:11px 14px;border-bottom:1px solid var(--border);background:var(--bg-soft);white-space:nowrap}
table td{padding:12px 14px;border-bottom:1px solid var(--border);font-size:.84rem;vertical-align:middle}
table tr:last-child td{border-bottom:0}
table tbody tr:hover{background:var(--bg-soft)}

.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100dvh}
.sidebar{border-right:1px solid var(--border);background:var(--bg-soft);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.nav-sec{margin-top:12px}
.nav-sec-label{font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;font-size:.85rem;font-weight:520;color:var(--text-2);cursor:pointer;width:100%;text-align:left;transition:background .15s,color .15s}
.nav-item:hover{background:var(--bg-sunken);color:var(--text)}
.nav-item.on{background:var(--card);color:var(--text);font-weight:620;border:1px solid var(--border)}
.main{padding:26px 30px 80px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1rem}
.logo-mark{width:28px;height:28px;border-radius:9px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:.78rem;font-weight:800}

.mobile-topbar{display:none;height:56px;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--border);background:var(--bg-soft);position:sticky;top:0;z-index:70}
.hamburger{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--bg);display:grid;place-items:center}
.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-back.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,290px);z-index:100;background:var(--bg-soft);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.drawer.open{transform:translateX(0)}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{display:none}
  .mobile-topbar{display:flex}
  .main{padding:16px 14px 60px}
}
@media(min-width:901px){.drawer,.drawer-back,.mobile-topbar{display:none!important}}

.empty{padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--text-2)}
.empty h3{font-size:.98rem;color:var(--text)}

.divider{height:1px;background:var(--border);margin:20px 0}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--accent-soft);font-size:.8rem;line-height:1.55;color:var(--text-2)}
.notice.warn{background:var(--warn-soft)}
.notice.danger{background:var(--danger-soft)}
.notice.ok{background:var(--ok-soft)}

#toast-root{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--border-2);border-radius:12px;padding:11px 14px;min-width:220px;max-width:360px;box-shadow:var(--shadow);font-size:.82rem;font-weight:520;display:flex;align-items:center;gap:10px;transform:translateX(120%);opacity:0;transition:transform .3s,opacity .3s}
.toast.show{transform:translateX(0);opacity:1}
.toast .bar{width:3px;height:20px;border-radius:2px;background:var(--text-3);flex:none}
.toast.ok .bar{background:var(--ok)}.toast.err .bar{background:var(--danger)}.toast.warn .bar{background:var(--warn)}

.modal-back{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;max-width:460px;width:100%;box-shadow:var(--shadow)}

.auth-wrap{min-height:100dvh;display:grid;place-items:center;padding:24px}
.auth-card{width:100%;max-width:400px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-root"></div>

<script type="module">

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
  authDomain: "quocdat-396fe.firebaseapp.com",
  projectId: "quocdat-396fe",
  storageBucket: "quocdat-396fe.firebasestorage.app",
  messagingSenderId: "685476439350",
  appId: "1:685476439350:web:949054ecba7f0a0c383f97"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ============================================================
   HARDCODED SUPERADMIN
   ------------------------------------------------------------
   Đăng nhập: username "digitalsmod" hoặc email nội bộ
   Mật khẩu: "ame1610@"
   Lần đầu đăng nhập sẽ tự tạo tài khoản Firebase Auth.
   ============================================================ */
const ADMIN_USERNAME = 'digitalsmod';
const ADMIN_PASSWORD = 'ame1610@';
const ADMIN_EMAIL    = 'digitalsmod@linkora.admin';

const S = { user:null, profile:null, route:'overview', ready:false, error:null };

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtVND=n=>Number(n||0).toLocaleString('vi-VN')+'đ';
const fmtNum=n=>Number(n||0).toLocaleString('vi-VN');
function toDate(ts){ if(!ts) return null; return ts.toDate?ts.toDate():new Date(ts); }
function timeAgo(ts){ const d=toDate(ts); if(!d) return '—'; const s=(Date.now()-d.getTime())/1000;
  if(s<60) return 'vừa xong'; if(s<3600) return Math.floor(s/60)+'p';
  if(s<86400) return Math.floor(s/3600)+'h'; if(s<2592000) return Math.floor(s/86400)+'d';
  return d.toLocaleDateString('vi-VN'); }

function toast(msg,type='info'){
  const root=$('#toast-root'); if(!root) return;
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML=`<span class="bar"></span><span>${esc(msg)}</span>`;
  root.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3200);
}
function confirmModal({title,message,confirmText='Xác nhận',danger=false}){
  return new Promise(resolve=>{
    const back=document.createElement('div'); back.className='modal-back';
    back.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>
      <p style="margin:8px 0 18px;font-size:.86rem;line-height:1.6;color:var(--text-2)">${esc(message)}</p>
      <div class="row gap-8" style="justify-content:flex-end">
        <button class="btn ghost" data-x="cancel">Huỷ</button>
        <button class="btn ${danger?'danger':''}" data-x="ok">${esc(confirmText)}</button>
      </div></div>`;
    const close=v=>{ back.remove(); resolve(v); };
    back.addEventListener('click',e=>{
      if(e.target===back) return close(false);
      const b=e.target.closest('[data-x]'); if(!b) return;
      close(b.dataset.x==='ok');
    });
    $('#modal-root').appendChild(back);
  });
}

/* ---------------- NAV ---------------- */
const NAV = [
  { sec:'Tổng quan', items:[['overview','Dashboard'],['economics','Network Economics']]},
  { sec:'Nội dung', items:[['networks','Networks'],['rates','Rate history']]},
  { sec:'Kinh doanh', items:[['sellers','Seller duyệt'],['lq-keys','Key Liên Quân'],['creator','Creator subs'],['withdrawals','Rút tiền']]},
  { sec:'Vận hành', items:[['fraud','Gian lận'],['users','Người dùng'],['audit','Audit log']]},
];

function renderSidebar(route){
  const name=S.profile?.displayName||S.user?.email?.split('@')[0]||'Admin';
  const initial=(name[0]||'A').toUpperCase();
  return `
  <aside class="sidebar">
    <div style="padding:4px 8px 14px">

    ${NAV.map(g=>`
      <div class="nav-sec">

        ${g.items.map(([r,label])=>`
          <button class="nav-item ${route===r?'on':''}" data-goto="${r}">${label}</button>`).join('')}
      </div>`).join('')}
    <div style="margin-top:auto;padding-top:14px;border-top:1px solid var(--border)">
      <div class="row gap-8" style="padding:6px 8px">
        <div style="width:30px;height:30px;border-radius:9px;background:var(--bg-sunken);border:1px solid var(--border);display:grid;place-items:center;font-size:.72rem;font-weight:750">${esc(initial)}</div>
        <div style="min-width:0;flex:1">
          <div class="small" style="font-weight:620;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</div>
          <div class="tiny muted-3" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(S.user?.email||'')}</div>
        </div>
      </div>
      <button class="nav-item" data-action="logout" style="margin-top:6px">Đăng xuất</button>
    </div>
  </aside>`;
}
function renderDrawer(route){
  return `
  <div class="drawer-back" id="drawer-back"></div>
  <aside class="drawer" id="drawer">
    <div class="logo" style="padding:6px 10px 14px;border-bottom:1px solid var(--border);margin-bottom:12px">
      <span class="logo-mark">L</span><span>Admin</span>
    </div>
    ${NAV.map(g=>`
      <div class="nav-sec">
        <div class="nav-sec-label">${g.sec}</div>
        ${g.items.map(([r,label])=>`
          <button class="nav-item ${route===r?'on':''}" data-goto="${r}">${label}</button>`).join('')}
      </div>`).join('')}
    <button class="nav-item" data-action="logout" style="margin-top:auto">Đăng xuất</button>
  </aside>`;
}
function openDrawer(){ $('#drawer')?.classList.add('open'); $('#drawer-back')?.classList.add('open'); }
function closeDrawer(){ $('#drawer')?.classList.remove('open'); $('#drawer-back')?.classList.remove('open'); }
function nav(r){ location.hash='#/'+r; closeDrawer(); }

function parseHash(){ return (location.hash||'#/').replace(/^#\/?/,'')||'overview'; }

/* ---------------- AUTH ---------------- */
function renderAuth(){
  return `<div class="auth-wrap">
    <div class="auth-card">
      <div class="card" style="padding:30px">
        <div class="logo" style="margin-bottom:22px"><span class="logo-mark">L</span><span>Linkora Admin</span></div>
        <h1 style="margin-bottom:6px">Đăng nhập quản trị</h1>
        <p class="small muted" style="margin-bottom:20px">Nhập username hoặc email admin.</p>
        <form id="admin-login">
          <div class="field"><label>Tài khoản</label><input class="input" id="al-email" type="text" autocomplete="username" placeholder="digitalsmod" required /></div>
          <div class="field"><label>Mật khẩu</label><input class="input" id="al-pass" type="password" autocomplete="current-password" required /></div>
          <div id="al-error" class="notice danger hidden" style="margin-bottom:14px"></div>
          <button class="btn accent block" type="submit" id="al-submit" style="height:46px">Đăng nhập</button>
        </form>
        <p class="tiny muted-3" style="margin-top:16px;text-align:center">Linkora Admin · <a class="link" href="index.html" style="color:var(--accent)">Về trang người dùng</a></p>
      </div>
    </div>
  </div>`;
}

/* Map username → email nội bộ */
function normalizeLoginEmail(raw){
  const v = String(raw||'').trim();
  if(!v) return '';
  // Nếu chỉ có username (không có @) → chuyển sang email nội bộ
  if(!v.includes('@')){
    if(v.toLowerCase() === ADMIN_USERNAME) return ADMIN_EMAIL;
    return v.toLowerCase() + '@linkora.admin';
  }
  return v;
}

async function ensureAdminProfile(user){
  // Đảm bảo doc users/{uid} tồn tại và có role superadmin khi là tài khoản hardcode
  const ref = doc(db,'users',user.uid);
  const snap = await getDoc(ref);
  const isHardcodedAdmin = (user.email||'').toLowerCase() === ADMIN_EMAIL;
  if(snap.exists()){
    const data = snap.data();
    if(isHardcodedAdmin && !['superadmin','admin'].includes(data.role)){
      await updateDoc(ref,{ role:'superadmin', status:'active' });
      return { ...data, role:'superadmin', status:'active' };
    }
    return data;
  }
  const profile = {
    uid:user.uid,
    email:user.email||'',
    displayName: isHardcodedAdmin ? 'Super Admin' : (user.email||'').split('@')[0],
    role: isHardcodedAdmin ? 'superadmin' : 'user',
    status:'active',
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}

async function handleAdminLogin(){
  let raw = $('#al-email').value.trim();
  const pass = $('#al-pass').value;
  const err = $('#al-error'); const btn = $('#al-submit');
  err.classList.add('hidden');

  if(!raw){ err.textContent='Nhập tài khoản.'; err.classList.remove('hidden'); return; }
  if(!pass){ err.textContent='Nhập mật khẩu.'; err.classList.remove('hidden'); return; }

  const email = normalizeLoginEmail(raw);
  btn.disabled=true; btn.textContent='Đang đăng nhập…';

  try{
    await signInWithEmailAndPassword(auth, email, pass);
    toast('Đăng nhập thành công.','ok');
    // ensureAdminProfile sẽ chạy trong onAuthStateChanged
  }catch(e){
    // Nếu là tài khoản hardcode + đúng mật khẩu → tự tạo user lần đầu
    const isHardcoded = (email === ADMIN_EMAIL) || (raw.toLowerCase() === ADMIN_USERNAME);
    const correctPass = (pass === ADMIN_PASSWORD);

    if(isHardcoded && correctPass && (e.code==='auth/user-not-found' || e.code==='auth/invalid-credential' || e.code==='auth/invalid-login-credentials')){
      try{
        const cred = await createUserWithEmailAndPassword(auth, ADMIN_EMAIL, ADMIN_PASSWORD);
        await setDoc(doc(db,'users',cred.user.uid),{
          uid: cred.user.uid,
          email: ADMIN_EMAIL,
          displayName:'Super Admin',
          role:'superadmin',
          status:'active',
          createdAt: serverTimestamp(),
        });
        toast('Đã khởi tạo tài khoản Super Admin.','ok');
      }catch(err2){
        console.error(err2);
        err.textContent = 'Không thể khởi tạo admin: ' + (err2.message||err2.code||'lỗi');
        err.classList.remove('hidden');
      }
    } else if(isHardcoded && !correctPass){
      err.textContent='Sai mật khẩu quản trị.';
      err.classList.remove('hidden');
    } else {
      err.textContent='Sai thông tin hoặc không có quyền.';
      err.classList.remove('hidden');
    }
  }finally{ btn.disabled=false; btn.textContent='Đăng nhập'; }
}

/* ---------------- VIEWS ---------------- */
function renderPage(title, sub, actions=''){

async function editNetwork(id){
  const snap=await getDoc(doc(db,'networks',id));
  if(!snap.exists()) return;
  const n=snap.data();
  const back=document.createElement('div'); back.className='modal-back';
  back.innerHTML=`<div class="modal" style="max-width:520px">
    <h3 style="margin-bottom:6px">${esc(n.name)}</h3>
    <p class="small muted" style="margin-bottom:14px">Chỉnh rate và giới hạn. Thay đổi rate ghi audit log.</p>
    <div class="grid c2" style="gap:12px">
      <div class="field"><label>Gross rate</label><input class="input" id="en-rate" type="number" value="${n.grossRate||0}" /></div>
      <div class="field"><label>User share %</label><input class="input" id="en-user" type="number" value="${n.userSharePercent??60}" /></div>
      <div class="field"><label>Min payout</label><input class="input" id="en-min" type="number" value="${n.minPayout||50000}" /></div>
      <div class="field"><label>Max/ IP/ ngày</label><input class="input" id="en-ip" type="number" value="${n.maxViewsPerIpPerDay??1}" /></div>
      <div class="field"><label>Max/ device/ ngày</label><input class="input" id="en-dev" type="number" value="${n.maxViewsPerDevicePerDay??1}" /></div>
      <div class="field"><label>Cooldown (s)</label><input class="input" id="en-cd" type="number" value="${n.cooldownSeconds??86400}" /></div>
    </div>
    <div class="field"><label>Trạng thái</label>
      <select class="select" id="en-enabled"><option value="true" ${n.enabled!==false?'selected':''}>Bật</option><option value="false" ${n.enabled===false?'selected':''}>Tắt</option></select>
    </div>
    <div class="field"><label>Lý do thay đổi *</label><input class="input" id="en-reason" /></div>
    <div class="row gap-8" style="justify-content:flex-end">
      <button class="btn ghost" data-x="cancel">Huỷ</button>
      <button class="btn accent" data-x="save">Lưu</button>
    </div>
  </div>`;
  const close=()=>back.remove();
  back.addEventListener('click', async e=>{
    if(e.target===back) return close();
    const b=e.target.closest('[data-x]'); if(!b) return;
    if(b.dataset.x==='cancel') return close();
    const newRate=Number($('#en-rate').value||0);
    const userShare=Number($('#en-user').value||60);
    const reason=$('#en-reason').value.trim();
    if(!reason){ toast('Cần lý do.','err'); return; }
    try{
      await setDoc(doc(db,'networks',id),{
        ...n, grossRate:newRate, userSharePercent:userShare, platformSharePercent:100-userShare,
        minPayout:Number($('#en-min').value||0),
        maxViewsPerIpPerDay:Number($('#en-ip').value||1),
        maxViewsPerDevicePerDay:Number($('#en-dev').value||1),
        cooldownSeconds:Number($('#en-cd').value||86400),
        enabled:$('#en-enabled').value==='true',
        updatedAt:serverTimestamp(),
      },{merge:true});
      if(Number(n.grossRate)!==newRate){
        await addDoc(collection(db,'rateHistory'),{
          networkId:id, oldRate:Number(n.grossRate||0), newRate,
          changedBy:S.user.uid, changedAt:serverTimestamp(), reason,
        });
      }
      await addDoc(collection(db,'auditLogs'),{
        adminId:S.user.uid, action:'ADMIN_UPDATED_NETWORK',
        targetType:'network', targetId:id, reason, timestamp:serverTimestamp(),
      });
      toast('Đã cập nhật.','ok'); close(); loadNetworks();
    }catch{ toast('Không thể cập nhật.','err'); }
  });
  $('#modal-root').appendChild(back);
}

async function loadLQKeys(){
  const box=$('#lq-box'); if(!box) return;
  try{
    const snap=await getDocs(query(collection(db,'lq_keys'), limit(500)));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    const grouped={};
    rows.forEach(r=>{ (grouped[r.duration]=grouped[r.duration]||[]).push(r); });

    let html=`<div style="padding:14px 16px;border-bottom:1px solid var(--border)"><span class="card-title">Kho key</span> <span class="badge">${rows.length}</span></div>`;
    html+=`<div class="table-scroll"><table><thead><tr>
      <th>Loại</th><th>Còn</th><th>Đã bán</th><th>Tổng</th>
    </tr></thead><tbody>`;
    LQ_DURATIONS.forEach(d=>{
      const list=grouped[d.id]||[];
      const avail=list.filter(k=>k.status==='available').length;
      const sold=list.filter(k=>k.status==='sold').length;
      html+=`<tr><td style="font-weight:600">${d.label}</td>
        <td class="mono" style="color:var(--ok);font-weight:620">${avail}</td>
        <td class="mono muted">${sold}</td>
        <td class="mono">${list.length}</td></tr>`;
    });
    html+=`</tbody></table></div>`;
    box.innerHTML=html;
  }catch{ box.innerHTML='<div class="empty"><h3>Không tải được</h3></div>'; }
}
async function handleAddLQKeys(){
  const duration=$('#lq-duration').value;
  const price=Number($('#lq-price').value||0);
  const raw=$('#lq-codes').value||'';
  const codes=raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!codes.length){ toast('Chưa có key nào.','err'); return; }
  if(price<0){ toast('Giá không hợp lệ.','err'); return; }
  const btn=$('#lq-submit'); btn.disabled=true; btn.textContent='Đang nhập…';
  try{
    let ok=0;
    for(const code of codes){
      const dup=await getDocs(query(collection(db,'lq_keys'), where('code','==',code), limit(1)));
      if(!dup.empty) continue;
      await addDoc(collection(db,'lq_keys'),{
        code, duration, price, status:'available',
        createdAt:serverTimestamp(), createdBy:S.user.uid,
      });
      ok++;
    }
    await addDoc(collection(db,'auditLogs'),{
      adminId:S.user.uid, action:'ADMIN_ADDED_LQ_KEYS',
      targetType:'lq_keys', targetId:duration,
      reason:`Thêm ${ok}/${codes.length} key`, timestamp:serverTimestamp(),
    });
    toast(`Đã nhập ${ok}/${codes.length} key.`,'ok');
    $('#lq-codes').value='';
    loadLQKeys();
  }catch(e){ toast('Không thể nhập.','err'); console.error(e); }
  finally{ btn.disabled=false; btn.textContent='Nhập kho'; }
}

  <div class="card" style="padding:0;overflow:hidden" id="wd-box">Đang tải…</div>`;
}
async function loadWithdrawals(){
  const box=$('#wd-box'); if(!box) return;
  try{
    const snap=await getDocs(query(collection(db,'withdrawals'), limit(100)));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    if(!rows.length){ box.innerHTML='<div class="empty"><h3>Chưa có yêu cầu</h3></div>'; return; }
    box.innerHTML=`
      <div class="table-scroll"><table><thead><tr>
        <th>Người dùng</th><th>Số tiền</th><th>Phương thức</th><th>Chi tiết</th><th>Trạng thái</th><th>Ngày</th><th>Thao tác</th>
      </tr></thead><tbody>
      ${rows.map(r=>{
        const d=r.details||{};
        const masked=d.accountNumber ? '••••'+String(d.accountNumber).slice(-4) : (d.telco||d.note||'—');
        return `<tr>
          <td class="tiny muted" style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${esc(r.userEmail||r.userId)}</td>
          <td class="mono" style="font-weight:620">${fmtVND(r.amount)}</td>
          <td class="small">${esc(r.method)}</td>
          <td class="tiny muted">${esc(masked)}</td>
          <td>${badge(r.status)}</td>
          <td class="tiny muted-3">${timeAgo(r.createdAt)}</td>
          <td>
            ${(r.status==='pending'||r.status==='reviewing') ? `
              <div class="row gap-6">
                <button class="btn xs ok" data-action="approve-wd" data-id="${esc(r.id)}">Duyệt</button>
                <button class="btn xs danger" data-action="reject-wd" data-id="${esc(r.id)}">Từ chối</button>
              </div>` : '<span class="tiny muted-3">—</span>'}
          </td>
        </tr>`;}).join('')}
      </tbody></table></div>`;
  }catch{ box.innerHTML='<div class="empty"><h3>Không tải được</h3></div>'; }
}
async function approveWD(id){
  const ok=await confirmModal({title:'Duyệt rút tiền?',message:'Chuyển sang approved.',confirmText:'Duyệt'});
  if(!ok) return;
  try{
    await updateDoc(doc(db,'withdrawals',id),{status:'approved',approvedAt:serverTimestamp(),approvedBy:S.user.uid});
    await addDoc(collection(db,'auditLogs'),{adminId:S.user.uid,action:'ADMIN_APPROVED_WITHDRAWAL',targetType:'withdrawal',targetId:id,reason:'Manual approval',timestamp:serverTimestamp()});
    toast('Đã duyệt.','ok'); loadWithdrawals();
  }catch{ toast('Không thể duyệt.','err'); }
}
async function rejectWD(id){
  const ok=await confirmModal({title:'Từ chối?',message:'Số dư cần hoàn qua Cloud Function.',confirmText:'Từ chối',danger:true});
  if(!ok) return;
  try{
    await updateDoc(doc(db,'withdrawals',id),{status:'rejected',rejectedAt:serverTimestamp(),rejectedBy:S.user.uid});
    await addDoc(collection(db,'auditLogs'),{adminId:S.user.uid,action:'ADMIN_REJECTED_WITHDRAWAL',targetType:'withdrawal',targetId:id,reason:'Manual rejection',timestamp:serverTimestamp()});
    toast('Đã từ chối.','ok'); loadWithdrawals();
  }catch{ toast('Không thể từ chối.','err'); }
}

/* ---------------- ROUTER ---------------- */
const VIEWS = {
  overview: [viewOverview, loadOverview],
  economics: [viewEconomics, loadEconomics],
  networks: [viewNetworks, loadNetworks],
  rates: [viewRates, loadRates],
  sellers: [viewSellers, loadSellers],
  'lq-keys': [viewLQKeys, loadLQKeys],
  creator: [viewCreator, loadCreator],
  withdrawals: [viewWithdrawals, loadWithdrawals],
  fraud: [viewFraud, loadFraud],
  users: [viewUsers, loadUsers],
  audit: [viewAudit, loadAudit],
};

function render(){
  const el=$('#app');
  if(!S.ready){ el.innerHTML='<div style="min-height:100dvh;display:grid;place-items:center"><div class="muted">Đang tải…</div></div>'; return; }
  if(!S.user){ el.innerHTML=renderAuth(); return; }
  if(!['admin','superadmin','finance','moderator','support','analyst'].includes(S.profile?.role)){
    el.innerHTML=`<div style="min-height:100dvh;display:grid;place-items:center;padding:24px">
      <div class="card" style="max-width:420px;text-align:center">
        <h3 style="margin-bottom:8px">Không có quyền</h3>
        <p class="small muted" style="margin-bottom:16px">Tài khoản của bạn không phải admin.</p>
        <button class="btn" data-action="logout">Đăng xuất</button>
      </div></div>`;
    return;
  }
  const route=parseHash();
  S.route=route;
  const view=VIEWS[route]||VIEWS.overview;
  el.innerHTML=`
    <div class="shell">
      ${renderSidebar(route)}
      ${renderDrawer(route)}
      <main class="main">${view[0]()}</main>
    </div>`;
  view[1]?.();
}
window.addEventListener('hashchange',()=>{ closeDrawer(); render(); });

/* ---------------- GLOBAL EVENTS ---------------- */
document.addEventListener('click', async (e)=>{
  const t=e.target;
  if(t.closest('#drawer-back')){ closeDrawer(); return; }
  const go=t.closest('[data-goto]');
  if(go){ nav(go.dataset.goto); return; }
  const a=t.closest('[data-action]');
  if(!a) return;
  const act=a.dataset.action;
  if(act==='logout'){ await signOut(auth); toast('Đã đăng xuất.','ok'); return; }
  if(act==='open-drawer'){ openDrawer(); return; }
  if(act==='edit-net'){ editNetwork(a.dataset.id); return; }
  if(act==='approve-seller'){ approveSeller(a.dataset.id); return; }
  if(act==='reject-seller'){ rejectSeller(a.dataset.id); return; }
  if(act==='approve-sub'){ approveSub(a.dataset.id); return; }
  if(act==='reject-sub'){ rejectSub(a.dataset.id); return; }
  if(act==='approve-wd'){ approveWD(a.dataset.id); return; }
  if(act==='reject-wd'){ rejectWD(a.dataset.id); return; }
});
document.addEventListener('submit',(e)=>{
  e.preventDefault();
  if(e.target.id==='admin-login') handleAdminLogin();
  else if(e.target.id==='lq-form') handleAddLQKeys();
});

/* ---------------- AUTH STATE ---------------- */
onAuthStateChanged(auth, async (user)=>{
  S.user=user; S.profile=null;
  if(user){
    try{
      S.profile = await ensureAdminProfile(user);
    }catch(e){ console.error('[admin] profile error', e); }
  }
  S.ready=true;
  render();
});
</script>
