<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>DIGITALSMOD TTS</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    background:
        radial-gradient(circle at 20% 10%, #1d2635, transparent 35%),
        radial-gradient(circle at 80% 90%, #162033, transparent 35%),
        #07090d;
    color: #fff;
}

.app {
    width: min(900px, calc(100% - 28px));
    margin: auto;
    padding: 35px 0 70px;
}

.header {
    text-align: center;
    margin-bottom: 28px;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: -1px;
}

.sub {
    margin-top: 8px;
    color: #8e98a8;
    font-size: 14px;
}

.card {
    border: 1px solid rgba(255,255,255,.09);
    background: rgba(255,255,255,.045);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-radius: 28px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 20px 70px rgba(0,0,0,.25);
}

textarea {
    width: 100%;
    min-height: 190px;
    resize: vertical;
    border: 0;
    outline: 0;
    border-radius: 20px;
    padding: 18px;
    background: rgba(0,0,0,.25);
    color: white;
    font-size: 16px;
    line-height: 1.65;
}

textarea::placeholder {
    color: #687181;
}

.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
}

select,
input[type=range] {
    width: 100%;
}

select {
    padding: 15px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 16px;
    background: #11151d;
    color: white;
    outline: none;
}

label {
    display: block;
    font-size: 12px;
    color: #8791a1;
    margin-bottom: 8px;
}

button {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    border: 0;
    border-radius: 18px;
    background: white;
    color: #080a0d;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.secondary {
    background: rgba(255,255,255,.08);
    color: white;
}

.progress-box {
    display: none;
}

.progress {
    height: 10px;
    background: rgba(255,255,255,.08);
    border-radius: 99px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: white;
    transition: width .2s ease;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 13px;
}

.status {
    color: #9ba5b5;
}

.storage {
    margin-top: 14px;
    color: #7e8999;
    font-size: 12px;
}

audio {
    width: 100%;
    margin-top: 15px;
}

.hidden {
    display: none !important;
}

.voice-info {
    margin-top: 12px;
    padding: 12px;
    border-radius: 15px;
    background: rgba(255,255,255,.04);
    color: #9da6b4;
    font-size: 13px;
}

@media(max-width:650px) {
    .row {
        grid-template-columns: 1fr;
    }

    .app {
        width: min(100% - 18px, 900px);
        padding-top: 20px;
    }

    .card {
        border-radius: 22px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="logo">DIGITALSMOD TTS</div>
        <div class="sub">
            Vietnamese AI Voice • On-device
        </div>
    </header>

    <!-- MODEL -->
    <section class="card">

        <div class="progress-info">
            <span>Voice Engine</span>
            <strong id="modelPercent">0%</strong>
        </div>

        <div class="progress">
            <div id="modelProgress" class="progress-bar"></div>
        </div>

        <div class="status" id="modelStatus">
            Đang kiểm tra dữ liệu...
        </div>

        <div class="storage" id="storageInfo">
            Chưa kiểm tra bộ nhớ
        </div>

        <button
            id="loadModelBtn"
            class="secondary">
            Tải dữ liệu giọng nói
        </button>

    </section>

    <!-- TEXT -->
    <section class="card">

        <label>NỘI DUNG</label>

        <textarea
            id="text"
            placeholder="Nhập nội dung bạn muốn lồng tiếng...

Ví dụ:
Anh em ơi, hôm nay mình sẽ giới thiệu cho mọi người một ứng dụng cực kỳ hay."></textarea>

        <div class="row">

            <div>
                <label>GIỌNG</label>

                <select id="voice">
                    <option value="bao_kim">
                        Bảo Kim • Nữ
                    </option>

                    <option value="khanh_vy">
                        Khánh Vy • Nữ
                    </option>

                    <option value="ngoc_huyen">
                        Ngọc Huyền • Nữ
                    </option>

                    <option value="phuong_linh">
                        Phương Linh • Nữ
                    </option>

                    <option value="quynh_nhu">
                        Quỳnh Như • Nữ
                    </option>

                    <option value="gia_bao">
                        Gia Bảo • Nam
                    </option>

                    <option value="hoang_nam">
                        Hoàng Nam • Nam
                    </option>

                    <option value="huu_dat">
                        Hữu Đạt • Nam
                    </option>

                    <option value="quang_huy">
                        Quang Huy • Nam
                    </option>

                    <option value="thanh_phong">
                        Thanh Phong • Nam
                    </option>
                </select>
            </div>

            <div>
                <label>TỐC ĐỘ</label>

                <input
                    id="speed"
                    type="range"
                    min=".75"
                    max="1.25"
                    value="1"
                    step=".01">

                <div id="speedValue">
                    1.00x
                </div>
            </div>

        </div>

        <div class="voice-info">
            Engine được thiết kế để chạy trực tiếp trên thiết bị.
            Model được lưu local sau lần tải đầu tiên.
        </div>

        <button id="generateBtn" disabled>
            Tạo giọng nói
        </button>

    </section>

    <!-- RESULT -->
    <section id="resultCard" class="card hidden">

        <label>ÂM THANH</label>

        <audio
            id="audio"
            controls>
        </audio>

        <button id="downloadBtn">
            Tải WAV
        </button>

    </section>

</div>

<script src="model-loader.js"></script>
<script src="tts-engine.js"></script>
<script src="app.js"></script>

</body>
</html>
