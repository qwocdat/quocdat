<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>V-TTS Web | Vietnamese AI Voice</title>

    <meta
        name="description"
        content="Vietnamese Text-to-Speech chạy trực tiếp trên trình duyệt bằng ONNX Runtime Web."
    >

    <!-- ONNX Runtime Web -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js"></script>

    <!-- Vietnamese G2P -->
    <script src="https://huggingface.co/spaces/letrggghieu/v-vietnamese-tts-web/resolve/main/vietnamese_g2p.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #08090d;
            --card: rgba(255,255,255,.07);
            --border: rgba(255,255,255,.1);
            --text: #fff;
            --muted: #9297a5;
            --accent: #00d4ff;
            --accent2: #007aff;
            --danger: #ff453a;
            --success: #30d158;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 0%,
                    rgba(0,122,255,.22),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 90% 20%,
                    rgba(0,212,255,.12),
                    transparent 30%
                ),
                var(--bg);

            padding: 20px;
        }

        .app {
            width: min(760px, 100%);
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 35px 10px 25px;
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;

            display: grid;
            place-items: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    135deg,
                    rgba(0,212,255,.9),
                    rgba(0,122,255,.9)
                );

            box-shadow:
                0 15px 50px rgba(0,122,255,.35);

            font-size: 28px;
        }

        h1 {
            font-size: clamp(28px, 7vw, 42px);
            letter-spacing: -1.5px;
        }

        .subtitle {
            margin-top: 8px;
            color: var(--muted);
            font-size: 14px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 22px;

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 25px 80px rgba(0,0,0,.3);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 10px;

            padding: 13px 15px;
            margin-bottom: 18px;

            border-radius: 17px;

            background: rgba(255,255,255,.05);

            color: var(--muted);

            font-size: 13px;
        }

        .dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;
            background: #ffcc00;

            box-shadow:
                0 0 12px rgba(255,204,0,.7);
        }

        .dot.ready {
            background: var(--success);
            box-shadow:
                0 0 12px rgba(48,209,88,.7);
        }

        .dot.error {
            background: var(--danger);
            box-shadow:
                0 0 12px rgba(255,69,58,.7);
        }

        .progress {
            height: 4px;
            margin-top: -8px;
            margin-bottom: 18px;

            border-radius: 20px;
            overflow: hidden;

            background: rgba(255,255,255,.08);
        }

        .progress.hidden {
            display: none;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    var(--accent2),
                    var(--accent)
                );

            transition: width .3s ease;
        }

        .label {
            display: block;
            margin-bottom: 9px;

            font-size: 13px;
            font-weight: 600;

            color: #dfe3ec;
        }

        textarea {
            width: 100%;
            min-height: 160px;

            resize: vertical;

            padding: 16px;

            border: 1px solid var(--border);
            border-radius: 20px;

            outline: none;

            color: white;
            background: rgba(0,0,0,.2);

            font-family: inherit;
            font-size: 16px;
            line-height: 1.6;

            transition:
                border-color .2s,
                box-shadow .2s;
        }

        textarea:focus {
            border-color: rgba(0,212,255,.6);

            box-shadow:
                0 0 0 4px rgba(0,212,255,.08);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

            margin-top: 16px;
        }

        .field {
            min-width: 0;
        }

        select,
        input[type="range"] {
            width: 100%;
        }

        select {
            height: 48px;

            padding: 0 14px;

            border-radius: 15px;
            border: 1px solid var(--border);

            outline: none;

            background: rgba(255,255,255,.06);
            color: white;

            font-size: 14px;
        }

        select option {
            background: #111318;
            color: white;
        }

        .range-row {
            height: 48px;

            display: flex;
            align-items: center;
            gap: 12px;

            padding: 0 13px;

            border-radius: 15px;
            border: 1px solid var(--border);

            background: rgba(255,255,255,.06);
        }

        input[type="range"] {
            accent-color: var(--accent);
        }

        .range-value {
            width: 42px;
            text-align: right;

            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }

        button {
            width: 100%;
            height: 54px;

            margin-top: 18px;

            border: 0;
            border-radius: 18px;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    var(--accent2),
                    var(--accent)
                );

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 12px 35px rgba(0,122,255,.25);

            transition:
                transform .15s,
                opacity .15s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(.985);
        }

        button:disabled {
            opacity: .45;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;

            margin-top: 18px;

            text-align: center;
            color: var(--muted);

            font-size: 13px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            width: 28px;
            height: 28px;

            margin: 0 auto 10px;

            border: 3px solid rgba(255,255,255,.1);
            border-top-color: var(--accent);

            border-radius: 50%;

            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .result {
            display: none;

            margin-top: 18px;

            padding: 16px;

            border-radius: 20px;

            background: rgba(255,255,255,.05);
            border: 1px solid var(--border);
        }

        .result.show {
            display: block;
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .download {
            display: block;

            margin-top: 10px;

            padding: 12px;

            border-radius: 14px;

            text-align: center;
            text-decoration: none;

            color: white;
            background: rgba(255,255,255,.08);

            font-size: 13px;
            font-weight: 600;
        }

        .message {
            display: none;

            margin-top: 15px;
            padding: 12px 14px;

            border-radius: 15px;

            font-size: 13px;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #ffb3ae;
            background: rgba(255,69,58,.1);
        }

        .message.success {
            color: #a5efb9;
            background: rgba(48,209,88,.1);
        }

        .footer {
            padding: 20px;

            text-align: center;

            color: #686d79;
            font-size: 11px;
            line-height: 1.6;
        }

        @media(max-width: 600px) {
            body {
                padding: 12px;
            }

            .card {
                padding: 16px;
                border-radius: 24px;
            }

            .controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="logo">
            🎙️
        </div>

        <h1>V-TTS</h1>

        <p class="subtitle">
            Vietnamese AI Voice • ONNX Runtime Web
        </p>

    </header>


    <main class="card">

        <div class="status">

            <span
                id="statusDot"
                class="dot"
            ></span>

            <span id="statusText">
                Đang tải model AI...
            </span>

        </div>


        <div
            id="progress"
            class="progress"
        >
            <div
                id="progressBar"
                class="progress-bar"
            ></div>
        </div>


        <label class="label">
            Văn bản tiếng Việt
        </label>

        <textarea
            id="text"
            maxlength="3000"
            placeholder="Nhập nội dung bạn muốn chuyển thành giọng nói..."
        >Xin chào! Đây là hệ thống chuyển văn bản tiếng Việt thành giọng nói chạy trực tiếp trên trình duyệt.</textarea>


        <div class="controls">

            <div class="field">

                <label class="label">
                    Giọng đọc
                </label>

                <select id="speaker">

                    <option value="0">
                        NF • Nữ miền Bắc
                    </option>

                    <option value="1" selected>
                        SF • Nữ miền Nam
                    </option>

                    <option value="2">
                        NM1 • Nam miền Bắc
                    </option>

                    <option value="3">
                        SM • Nam miền Nam
                    </option>

                    <option value="4">
                        NM2 • Nam miền Bắc
                    </option>

                </select>

            </div>


            <div class="field">

                <label class="label">
                    Tốc độ
                </label>

                <div class="range-row">

                    <input
                        id="speed"
                        type="range"
                        min="0.5"
                        max="2"
                        step="0.05"
                        value="1"
                    >

                    <span
                        id="speedValue"
                        class="range-value"
                    >
                        1.00x
                    </span>

                </div>

            </div>

        </div>


        <button
            id="generateBtn"
            disabled
        >
            Tạo giọng nói
        </button>


        <div
            id="loading"
            class="loading"
        >

            <div class="spinner"></div>

            <div id="loadingText">
                Đang xử lý...
            </div>

        </div>


        <div
            id="message"
            class="message"
        ></div>


        <div
            id="result"
            class="result"
        >

            <div class="label">
                Kết quả
            </div>

            <audio
                id="audio"
                controls
            ></audio>

            <a
                id="download"
                class="download"
                download="vtts-output.wav"
            >
                Tải WAV
            </a>

        </div>

    </main>


    <footer class="footer">

        V-TTS chạy trực tiếp trên thiết bị của bạn.<br>

        Model được tải từ Hugging Face • ONNX Runtime Web

    </footer>

</div>


<!-- App logic -->
<script src="./app.js"></script>

</body>
</html>
