<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Linkora — Nền tảng kiếm tiền từ lượt truy cập hợp lệ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
img,svg,video{display:block;max-width:100%}
input,button,select,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;-webkit-appearance:none;appearance:none;border-radius:0;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{-webkit-box-shadow:0 0 0 1000px var(--bg-soft) inset !important;-webkit-text-fill-color:var(--text) !important;transition:background-color 9999s ease-in-out 0s}
::selection{background:rgba(37,99,235,.18);color:var(--text)}
:root{
  --bg:#ffffff;--bg-soft:#fafafa;--bg-sunken:#f4f4f5;
  --text:#111;--text-2:#666;--text-3:#9a9a9a;
  --border:rgba(0,0,0,.08);--border-2:rgba(0,0,0,.14);
  --card:#fff;--glass:rgba(255,255,255,.72);
  --accent:#2563eb;--accent-2:#1d4ed8;--accent-soft:rgba(37,99,235,.08);
  --ok:#059669;--ok-soft:rgba(5,150,105,.10);
  --warn:#b45309;--warn-soft:rgba(180,83,9,.10);
  --danger:#dc2626;--danger-soft:rgba(220,38,38,.09);
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 2px 8px rgba(0,0,0,.05);
  --shadow:0 8px 32px rgba(0,0,0,.07);
  --shadow-lg:0 20px 60px rgba(0,0,0,.10);
  --r-xs:10px;--r-sm:14px;--r:20px;--r-lg:26px;--r-xl:34px;
  --sidebar:264px;--maxw:1180px;--topbar:60px;
}
[data-theme="dark"]{
  --bg:#0a0a0a;--bg-soft:#101010;--bg-sunken:#151515;
  --text:#f5f5f5;--text-2:#a3a3a3;--text-3:#6b6b6b;
  --border:rgba(255,255,255,.10);--border-2:rgba(255,255,255,.18);
  --card:#101010;--glass:rgba(18,18,18,.72);
  --accent:#3b82f6;--accent-2:#60a5fa;--accent-soft:rgba(59,130,246,.14);
  --ok:#34d399;--ok-soft:rgba(52,211,153,.12);
  --warn:#fbbf24;--warn-soft:rgba(251,191,36,.12);
  --danger:#f87171;--danger-soft:rgba(248,113,113,.12);
  --shadow-xs:0 1px 2px rgba(0,0,0,.5);--shadow-sm:0 2px 8px rgba(0,0,0,.5);
  --shadow:0 8px 32px rgba(0,0,0,.55);--shadow-lg:0 20px 60px rgba(0,0,0,.7);
}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;letter-spacing:-0.005em}
h1,h2,h3,h4{letter-spacing:-0.03em;font-weight:700;line-height:1.12}
h1{font-size:clamp(2rem,5vw,3.6rem);font-weight:800}
h2{font-size:clamp(1.5rem,3.2vw,2.4rem)}
h3{font-size:1.12rem;letter-spacing:-0.02em}
p{color:var(--text-2)}
.small{font-size:.82rem}.tiny{font-size:.74rem}
.muted{color:var(--text-2)}.muted-3{color:var(--text-3)}
.mono{font-family:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.center{text-align:center}
.hidden{display:none !important}
.row{display:flex;align-items:center}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.wrap{flex-wrap:wrap}.grow{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.wrap-page{max-width:var(--maxw);margin:0 auto;padding:0 22px}
section{padding:80px 0}
section.tight{padding:52px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:14px;font-size:.9rem;font-weight:600;background:var(--text);color:var(--bg);border:1px solid transparent;transition:transform .18s,box-shadow .22s,background .18s,opacity .18s,border-color .18s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border-2)}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.soft{background:var(--bg-sunken);color:var(--text);border-color:var(--border)}
.btn.soft:hover{background:var(--bg-soft);border-color:var(--border-2)}
.btn.accent{background:var(--accent);color:#fff}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:.82rem;border-radius:11px}
.btn.xs{height:30px;padding:0 10px;font-size:.76rem;border-radius:9px}
.btn.block{width:100%}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field > label{font-size:.8rem;font-weight:600;color:var(--text-2)}
.input,.select,.textarea{width:100%;height:46px;padding:0 15px;background:var(--bg-soft);border:1px solid var(--border);border-radius:14px;font-size:.9rem;color:var(--text);transition:border-color .18s,background .18s,box-shadow .18s}
.textarea{height:auto;min-height:110px;padding:13px 15px;resize:vertical;line-height:1.5}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;cursor:pointer}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);background:var(--bg);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.hint{font-size:.75rem;color:var(--text-3);line-height:1.45}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:22px;transition:border-color .2s,box-shadow .25s,transform .25s}
.card.hoverable:hover{border-color:var(--border-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.card.pad-lg{padding:30px}
.card.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.card-title{font-size:.95rem;font-weight:650;letter-spacing:-0.015em}
.stat-value{font-size:1.85rem;font-weight:750;letter-spacing:-0.045em;line-height:1.05}
.stat-label{font-size:.76rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}
.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:8px;font-size:.72rem;font-weight:650;background:var(--bg-sunken);color:var(--text-2);border:1px solid var(--border)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.site-header{position:sticky;top:0;z-index:60;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--border)}
.site-header .inner{max-width:var(--maxw);margin:0 auto;padding:0 22px;height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.02rem;letter-spacing:-0.03em}
.logo-mark{width:30px;height:30px;border-radius:9px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:.86rem;font-weight:800;letter-spacing:-0.04em}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{padding:8px 13px;border-radius:10px;font-size:.86rem;font-weight:520;color:var(--text-2);transition:background .16s,color .16s}
.nav-links a:hover{background:var(--bg-soft);color:var(--text)}
.nav-links a.active{color:var(--text);font-weight:600}
@media(max-width:1000px){.nav-links{display:none}}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--border);background:var(--bg-soft);color:var(--text-2);transition:background .18s,color .18s,border-color .18s}
.icon-btn:hover{background:var(--bg-sunken);color:var(--text);border-color:var(--border-2)}
.hero{padding:70px 0 55px;position:relative;overflow:hidden}
.hero-glow{position:absolute;top:-260px;left:50%;transform:translateX(-50%);width:900px;height:600px;pointer-events:none;background:radial-gradient(ellipse at center, var(--accent-soft), transparent 68%);opacity:.85;filter:blur(20px)}
.hero .inner{position:relative;z-index:1}
.hero h1{max-width:16ch;margin-bottom:20px}
.hero .sub{font-size:1.06rem;max-width:56ch;line-height:1.55;color:var(--text-2)}
.pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:100px;background:var(--bg-soft);border:1px solid var(--border);font-size:.78rem;font-weight:550;color:var(--text-2)}
.preview{border:1px solid var(--border);border-radius:var(--r-xl);background:var(--card);box-shadow:var(--shadow-lg);overflow:hidden;position:relative}
.preview-bar{height:44px;display:flex;align-items:center;gap:7px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--bg-soft)}
.preview-bar i{width:9px;height:9px;border-radius:50%;background:var(--border-2);display:block}
.preview-body{padding:22px;display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:760px){.preview-body{grid-template-columns:1fr}}
.bars{display:flex;align-items:flex-end;gap:7px;height:120px;padding-top:12px}
.bars span{flex:1;background:var(--bg-sunken);border-radius:6px 6px 3px 3px;display:block}
.bars span.on{background:var(--text)}
.sec-head{max-width:640px;margin-bottom:40px}
.sec-head h2{margin-bottom:14px}
.sec-head p{font-size:1rem;line-height:1.6}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}
.step{position:relative;padding-top:26px}
.step .num{font-size:.74rem;font-weight:700;letter-spacing:.14em;color:var(--text-3);padding-bottom:14px;border-top:1px solid var(--border);display:block}
.step h3{margin-bottom:9px}
.step p{font-size:.9rem;line-height:1.6}
.net-avatar{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:750;font-size:.8rem;background:var(--bg-sunken);border:1px solid var(--border);color:var(--text-2)}
.faq-item{border-bottom:1px solid var(--border)}
.faq-q{width:100%;text-align:left;padding:20px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font-weight:600;font-size:.96rem}
.faq-q .chev{transition:transform .25s;color:var(--text-3);flex:none}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.2,.8,.3,1)}
.faq-a p{padding-bottom:20px;font-size:.9rem;line-height:1.65;max-width:70ch}
.site-footer{border-top:1px solid var(--border);padding:52px 0 40px;background:var(--bg-soft)}
.foot-grid{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:36px}
@media(max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot-col h4{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;font-weight:650}
.foot-col a{display:block;padding:5px 0;font-size:.87rem;color:var(--text-2);transition:color .16s}
.foot-col a:hover{color:var(--text)}
.auth-wrap{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:900px){.auth-wrap{grid-template-columns:1fr}}
.auth-aside{background:var(--bg-soft);border-right:1px solid var(--border);padding:52px;display:flex;flex-direction:column;justify-content:space-between}
@media(max-width:900px){.auth-aside{display:none}}
.auth-main{display:grid;place-items:center;padding:44px 22px}
.auth-card{width:100%;max-width:432px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg-sunken);border-radius:14px;margin-bottom:26px}
.tabs button{flex:1;height:38px;border-radius:11px;font-size:.86rem;font-weight:600;color:var(--text-2);transition:background .2s,color .2s,box-shadow .2s}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-xs)}
.captcha{border:1px solid var(--border);border-radius:16px;padding:16px;background:var(--bg-soft);margin-bottom:16px}
.captcha-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.captcha-head .q{font-size:.85rem;font-weight:600}
.captcha-head .q b{color:var(--accent)}
.captcha-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.captcha-cell{aspect-ratio:1;border-radius:12px;background:var(--card);border:1px solid var(--border);display:grid;place-items:center;font-size:1.8rem;cursor:pointer;transition:transform .15s,border-color .15s,background .15s;user-select:none}
.captcha-cell:hover{transform:scale(1.04);border-color:var(--border-2)}
.captcha-cell.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}
.captcha-cell.ok{border-color:var(--ok);background:var(--ok-soft)}
.captcha-cell.err{border-color:var(--danger);background:var(--danger-soft)}
.captcha-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:8px}
.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100dvh}
.sidebar{border-right:1px solid var(--border);background:var(--bg-soft);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100dvh;overflow-y:auto}
.sidebar .brand{padding:8px 10px 20px}
.nav-sec{margin-top:14px}
.nav-sec-label{font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);padding:0 12px 8px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;font-size:.875rem;font-weight:520;color:var(--text-2);transition:background .16s,color .16s;cursor:pointer;width:100%;text-align:left}
.nav-item:hover{background:var(--bg-sunken);color:var(--text)}
.nav-item.on{background:var(--card);color:var(--text);font-weight:620;box-shadow:var(--shadow-xs);border:1px solid var(--border)}
.nav-item svg{flex:none;opacity:.75}
.nav-item.on svg{opacity:1}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border)}
.main{padding:30px 34px 80px;min-width:0}
.mobile-topbar{display:none;height:var(--topbar);align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:70}
.hamburger{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--bg-soft);display:grid;place-items:center;color:var(--text)}
.drawer-back{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);z-index:90;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer-back.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,300px);z-index:100;background:var(--bg-soft);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .28s cubic-bezier(.2,.8,.3,1);display:flex;flex-direction:column;padding:16px 12px;overflow-y:auto}
.drawer.open{transform:translateX(0)}
@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.mobile-topbar{display:flex}.main{padding:16px 16px 60px}}
@media(min-width:901px){.mobile-topbar{display:none}.drawer,.drawer-back{display:none !important}}
.page-head{margin-bottom:26px}
.page-head h1{font-size:1.6rem;margin-bottom:6px;font-weight:750}
.page-head p{font-size:.9rem}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bg-sunken);color:var(--text-2);border:1px solid var(--border)}
.table-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table th{text-align:left;font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);padding:13px 18px;border-bottom:1px solid var(--border);background:var(--bg-soft);white-space:nowrap}
table td{padding:15px 18px;border-bottom:1px solid var(--border);font-size:.86rem;vertical-align:middle}
table tr:last-child td{border-bottom:0}
table tbody tr{transition:background .14s}
table tbody tr:hover{background:var(--bg-soft)}
.empty{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--bg-sunken);border:1px solid var(--border);color:var(--text-3)}
.empty h3{font-size:1rem}
.empty p{font-size:.86rem;max-width:38ch}
.skel{background:linear-gradient(90deg,var(--bg-sunken) 25%,var(--bg-soft) 50%,var(--bg-sunken) 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:8px;height:14px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
#toast-root{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);border:1px solid var(--border-2);border-radius:15px;padding:13px 17px;min-width:240px;max-width:380px;box-shadow:var(--shadow-lg);font-size:.86rem;font-weight:520;display:flex;align-items:center;gap:11px;transform:translateX(120%);opacity:0;transition:transform .34s,opacity .34s}
.toast.show{transform:translateX(0);opacity:1}
.toast .bar{width:3px;height:22px;border-radius:2px;background:var(--text-3);flex:none}
.toast.ok .bar{background:var(--ok)}
.toast.err .bar{background:var(--danger)}
.toast.warn .bar{background:var(--warn)}
.modal-back{position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);padding:28px;max-width:440px;width:100%;box-shadow:var(--shadow-lg)}
.divider{height:1px;background:var(--border);margin:26px 0}
.link{color:var(--accent);font-weight:550}
.link:hover{opacity:.72}
.copy-field{display:flex;align-items:center;gap:8px;background:var(--bg-sunken);border:1px solid var(--border);border-radius:13px;padding:6px 6px 6px 15px}
.copy-field input{flex:1;font-size:.84rem;background:transparent;min-width:0;font-family:'SF Mono',monospace}
.progress{height:6px;border-radius:100px;background:var(--bg-sunken);overflow:hidden}
.progress i{display:block;height:100%;background:var(--text);border-radius:100px;transition:width .5s}
.notice{display:flex;gap:11px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1px solid transparent;font-size:.82rem;line-height:1.55;color:var(--text-2)}
.notice.warn{background:var(--warn-soft)}
.notice.danger{background:var(--danger-soft)}
.notice.ok{background:var(--ok-soft)}
.legal-body{max-width:74ch;margin:0 auto}

function toDate(ts){ if(!ts) return null; return ts.toDate ? ts.toDate() : new Date(ts); }
function fmtDate(ts){ const d=toDate(ts); return d? d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'}) : '—'; }
function fmtDateTime(ts){ const d=toDate(ts); return d? d.toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; }
function timeAgo(ts){
  const d=toDate(ts); if(!d) return '—';
  const s=(Date.now()-d.getTime())/1000;
  if(s<60) return 'vừa xong';
  if(s<3600) return Math.floor(s/60)+' phút trước';
  if(s<86400) return Math.floor(s/3600)+' giờ trước';
  if(s<2592000) return Math.floor(s/86400)+' ngày trước';
  return fmtDate(ts);
}
function uid(len=10){
  const c='abcdefghijkmnpqrstuvwxyz23456789';
  const a=crypto.getRandomValues(new Uint8Array(len));
  let s=''; for(let i=0;i<len;i++) s+=c[a[i]%c.length];
  return s;
}
const isEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
function safeUrl(v){ try{const u=new URL(v); if(!['http:','https:'].includes(u.protocol)) return null; return u.toString();}catch{return null;} }
async function sha256(str){
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function parseQuery(){
  const hash = location.hash || '';
  const qi = hash.indexOf('?');
  if(qi === -1) return {};
  const qs = hash.slice(qi+1);
  const out = {};
  qs.split('&').forEach(p=>{
    const [k,v] = p.split('=');
    if(k) out[decodeURIComponent(k)] = decodeURIComponent(v||'');
  });
  return out;
}

/* ============================================================
   CAPTCHA
   ============================================================ */
const CAPTCHA_PAIRS = [
  ['🍎','🍏'],['🐶','🐺'],['🚗','🚙'],['⭐','🌟'],['🍕','🥧'],
  ['🐱','🐯'],['🌞','🌝'],['🎈','🎀'],['⚽','🏀'],['🌸','🌺'],
  ['🍔','🍟'],['🐸','🐢'],['🎩','👒'],['🥑','🥝'],['📘','📗'],
];
const Captcha = {
  target:null, pool:null, solved:false, nonce:0,
  generate(){
    const [a,b] = CAPTCHA_PAIRS[Math.floor(Math.random()*CAPTCHA_PAIRS.length)];
    const flip = Math.random()<.5;
    this.target = flip ? b : a;
    this.pool   = flip ? a : b;
    this.nonce++;
    this.solved = false;
  },
  renderHTML(){
    const cells = Array.from({length:9}, (_,i)=>{
      const isTarget = i === this.targetIdx;
      return `<button type="button" class="captcha-cell" data-cap="${i}">${isTarget?this.target:this.pool}</button>`;
    });
    return `
      <div class="captcha" id="captcha-box">
        <div class="captcha-head">
          <div class="q">Chọn ô <b>KHÁC</b> với 8 ô còn lại</div>
          <button type="button" class="btn xs ghost" data-cap-refresh>Đổi khác</button>
        </div>
        <div class="captcha-grid">${cells.join('')}</div>
        <div class="captcha-foot">
          <span class="tiny muted-3">Xác minh bạn là người thật</span>
          <span class="tiny" id="cap-status"></span>
        </div>
      </div>`;
  },
  get targetIdx(){ return this._idx; },
  set targetIdx(v){ this._idx = v; },
  init(){
    this._idx = Math.floor(Math.random()*9);
    this.solved = false;
    this.generate(); this._idx = Math.floor(Math.random()*9);
  },
  attach(root){
    if(!root) return;
    root.addEventListener('click', e=>{
      const refresh = e.target.closest('[data-cap-refresh]');
      if(refresh){
        this.init();
        const box = root.querySelector('#captcha-box');
        box.outerHTML = this.renderHTML();
        this.attach(root);
        return;
      }
      const cell = e.target.closest('[data-cap]');
      if(!cell) return;
      const idx = Number(cell.dataset.cap);
      const status = root.querySelector('#cap-status');
      if(idx === this._idx){
        this.solved = true;
        cell.classList.add('ok');
        status.textContent = 'Đã xác minh';
        status.style.color = 'var(--ok)';
      } else {
        this.solved = false;
        cell.classList.add('err');
        status.textContent = 'Sai, thử lại';
        status.style.color = 'var(--danger)';
      }
    });
  },
  reset(){
    this.init();
    const root = document;
    const box = root.querySelector('#captcha-box');
    if(box){ box.outerHTML = this.renderHTML(); this.attach(root); }
  }
};

async function ensureProfile(user){
  const ref = doc(db,'users',user.uid);
  const snap = await getDoc(ref);
  if(snap.exists()) return snap.data();
  let role='user';
  try{
    const q = query(collection(db,'users'), where('role','in',['admin','superadmin']), limit(1));
    const s = await getDocs(q);
    if(s.empty) role='superadmin';
  }catch{}
  const profile = {
    uid:user.uid, email:user.email||'',
    displayName:user.displayName||(user.email||'').split('@')[0],
    role, referralCode:uid(8).toUpperCase(), referredBy:null,
    status:'active', createdAt:serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}
async function ensureWallet(uidVal){
  const ref = doc(db,'wallets',uidVal);
  const snap = await getDoc(ref);
  if(snap.exists()) return snap.data();
  const w={ balance:0,pendingBalance:0,lifetimeEarnings:0,withdrawnAmount:0,frozenBalance:0,currency:'VND',updatedAt:serverTimestamp() };
  await setDoc(ref,w); return w;
}
async function loadNetworks(force=false){
  if(S.networks.length && !force) return S.networks;
  try{
    const snap = await getDocs(collection(db,'networks'));
    if(snap.empty){
      for(const n of DEFAULT_NETWORKS){
        try{ await setDoc(doc(db,'networks',n.id),{...n,createdAt:serverTimestamp()}); }catch{}
      }
      S.networks=[...DEFAULT_NETWORKS];
    } else {
      S.networks = snap.docs.map(d=>({id:d.id,...d.data()}));
    }
  }catch{ S.networks=[...DEFAULT_NETWORKS]; }
  return S.networks;
}
async function loadCampaigns(){
  try{
    const q = query(collection(db,'creatorCampaigns'), where('status','==','active'), limit(24));
    const s = await getDocs(q);
    S.campaigns = s.docs.map(d=>({id:d.id,...d.data()}));
  }catch{ S.campaigns=[]; }
  return S.campaigns;
}
async function loadLQKeys(){

    S.lqKeys = s.docs.map(d=>({id:d.id,...d.data()}));
  }catch{ S.lqKeys=[]; }

/* ============================================================
   ROUTER
   ============================================================ */
function parseHash(){
  const h=(location.hash||'#/').replace(/^#\/?/,'');
  const qi = h.indexOf('?');
  const path = qi===-1 ? h : h.slice(0,qi);
  const parts=path.split('/').filter(Boolean);
  return { route:parts[0]||'home', param:parts[1]||null, sub:parts[2]||null, query: parseQuery() };
}
function nav(path){ location.hash='#/'+path.replace(/^\/+/,''); closeDrawer(); }

function render(){
  const { route, param, query }=parseHash();
  S.route=route; S.param=param; S.query=query;
  const el=$('#app');

  if(route==='s' && param) return renderRedirect(el,param);
  if(route==='task-return' && param){ renderTaskReturn(el,param); return; }

  if(!S.ready){ el.innerHTML=renderBoot(); return; }
  if(S.bootError){ el.innerHTML=renderBootError(); return; }

  const dashRoutes=[
    'dashboard','links','create','statistics','creator','wallet','withdraw','transactions','referrals',
    'notifications','settings','support','seller-register','seller','seller-products','seller-sales',
    'seller-stats','seller-finance','lq-market','lq-my','tasks','my-tasks'
  ];
  const isDash=dashRoutes.includes(route);

  if(isDash && !S.user){ nav('login'); return; }

  if(route==='login'||route==='register'){
    if(S.user){ nav('dashboard'); return; }
    el.innerHTML=renderAuth(route); return;
  }

  const legal=['terms','privacy','anti-fraud','payout-policy','content-policy','cookie-policy','disclaimer','refund-policy','creator-policy','network-policy','seller-policy'];
  if(legal.includes(route)){ el.innerHTML=renderLegal(route); return; }
  if(route==='rates'){ el.innerHTML=renderRatesPage(); return; }
  if(route==='lq'||route==='lq-public'){ el.innerHTML=renderLQPublic(); return; }

  if(isDash){ el.innerHTML=renderDashboard(route); return; }
  el.innerHTML=renderLanding();
}
window.addEventListener('hashchange', ()=>{ closeDrawer(); render(); });

function openDrawer(){ S.drawerOpen=true; $('#drawer')?.classList.add('open'); $('#drawer-back')?.classList.add('open'); }
function closeDrawer(){ S.drawerOpen=false; $('#drawer')?.classList.remove('open'); $('#drawer-back')?.classList.remove('open'); }

function authError(msg){
  const el=$('#auth-error'); if(!el) return;
  if(!msg){ el.classList.add('hidden'); el.textContent=''; return; }
  el.classList.remove('hidden'); el.textContent=msg;
}

async function handleAuthSubmit(mode){
  const email=$('#a-email')?.value.trim()||'';
  const pass =$('#a-pass')?.value||'';
  const name =$('#a-name')?.value.trim()||'';
  const btn  =$('#auth-submit');
  authError('');

  if(!isEmail(email)) return authError('Email không hợp lệ.');
  if(pass.length<6) return authError('Mật khẩu phải có ít nhất 6 ký tự.');

  if(mode==='register'){
    if(!Captcha.solved) return authError('Vui lòng giải captcha (chọn ô khác với 8 ô còn lại).');
    const terms = $('#a-terms');
    if(!terms || !terms.checked) return authError('Bạn cần đồng ý điều khoản dịch vụ để tiếp tục.');
  }

  btn.disabled=true;
  btn.textContent = mode==='login'?'Đang đăng nhập…':'Đang tạo tài khoản…';
  try{
    if(mode==='login'){
      await signInWithEmailAndPassword(auth,email,pass);
      toast('Đăng nhập thành công.','ok');
    } else {
      const cred = await createUserWithEmailAndPassword(auth,email,pass);
      if(name) await updateProfile(cred.user,{displayName:name});

      // FIX REFERRAL: Retry lưu referredBy chắc chắn sau khi ensureProfile khởi tạo
      try{
        const refCode = new URLSearchParams((location.hash.split('?')[1]||'')).get('ref');
        if(refCode){
          const rq = query(collection(db,'users'), where('referralCode','==',refCode.toUpperCase()), limit(1));
          const rs = await getDocs(rq);
          if(!rs.empty){
            const referrerUid = rs.docs[0].id;
            let attempts = 0;
            const saveRef = async ()=>{
              attempts++;
              try{
                const check = await getDoc(doc(db,'users',cred.user.uid));
                if(check.exists()){
                  await updateDoc(doc(db,'users',cred.user.uid),{ referredBy: referrerUid });
                  return true;
                }
              }catch{}
              if(attempts < 5) setTimeout(saveRef, 800);
              return false;
            };
            setTimeout(saveRef, 800);
          }
        }
      }catch(e){ console.warn('ref error', e); }

      toast('Tài khoản đã được tạo.','ok');
    }
    nav('dashboard');
  }catch(e){
    const map={
      'auth/invalid-credential':'Email hoặc mật khẩu không đúng.',
      'auth/wrong-password':'Email hoặc mật khẩu không đúng.',
      'auth/user-not-found':'Tài khoản không tồn tại.',
      'auth/email-already-in-use':'Email này đã được sử dụng.',
      'auth/weak-password':'Mật khẩu quá yếu.',
      'auth/too-many-requests':'Quá nhiều lần thử. Vui lòng đợi.',
      'auth/network-request-failed':'Lỗi kết nối mạng.',
      'auth/operation-not-allowed':'Phương thức đăng nhập chưa bật trong Firebase Console.',
    };
    authError(map[e.code]||'Không thể xác thực.');
  }finally{
    btn.disabled=false;
    btn.textContent = mode==='login'?'Đăng nhập':'Tạo tài khoản';
  }
}

/* ============================================================
   TASK ENGINE (CHỐNG BYPASS CHUYÊN SÂU)
   ============================================================ */
let TASKS_CACHE = [];
let NET_APIS_CACHE = {};
let _taskTickTimer = null;
let _visibilityTrackerFn = null;

async function getMyIp(){
  const cached = sessionStorage.getItem('linkora_ip');
  const ts = Number(sessionStorage.getItem('linkora_ip_ts')||0);
  if(cached && Date.now()-ts < 30*60*1000) return cached;
  try{
    const r = await fetch('https://api.ipify.org?format=json', {cache:'no-store'});
    const j = await r.json();
    sessionStorage.setItem('linkora_ip', j.ip);
    sessionStorage.setItem('linkora_ip_ts', String(Date.now()));
    return j.ip;
  }catch{ return '127.0.0.1'; }
}

async function getDeviceHash(){
  const cached = localStorage.getItem('linkora_device_hash');
  if(cached) return cached;
  const parts = [
    navigator.userAgent, navigator.language,
    screen.width+'x'+screen.height, screen.colorDepth,
    new Date().getTimezoneOffset(),
    navigator.hardwareConcurrency||0, navigator.platform||'',
  ].join('|');
  const h = await sha256(parts);
  localStorage.setItem('linkora_device_hash', h);
  return h;
}

function buildNetworkUrl(apiConfig, targetUrl, returnUrl){
  if(!apiConfig || !apiConfig.urlTemplate) return null;
  let url = apiConfig.urlTemplate
    .replace(/\{API\}/g, apiConfig.apiKey||'')
    .replace(/\{URL\}/g, encodeURIComponent(targetUrl||''))
    .replace(/\{RETURN\}/g, encodeURIComponent(returnUrl||''));
  if(returnUrl && !apiConfig.urlTemplate.includes('{RETURN}') && !apiConfig.urlTemplate.includes('sub_link=')){
    url += (url.includes('?')?'&':'?') + 'sub_link=' + encodeURIComponent(returnUrl);
  }
  return url;
}

async function loadTasksConfig(force=false){
  if(TASKS_CACHE.length && !force) return TASKS_CACHE;
  try{
    const snap = await getDocs(query(collection(db,'tasks'), where('enabled','==',true), limit(50)));
    TASKS_CACHE = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(a.order||99)-(b.order||99));
  }catch(e){ console.error(e); TASKS_CACHE=[]; }
  return TASKS_CACHE;
}

async function loadNetworkApis(force=false){
  if(Object.keys(NET_APIS_CACHE).length && !force) return NET_APIS_CACHE;
  try{
    const snap = await getDocs(collection(db,'networkApis'));
    Object.keys(NET_APIS_CACHE).forEach(k=>delete NET_APIS_CACHE[k]);
    snap.docs.forEach(d=>{ NET_APIS_CACHE[d.id] = {id:d.id, ...d.data()}; });
  }catch(e){ console.error(e); }
  return NET_APIS_CACHE;
}

function getTaskCooldownRemaining(taskId, cooldownSec){
  const last = Number(localStorage.getItem('task_last_'+taskId)||0);
  const remain = cooldownSec*1000 - (Date.now()-last);
  return remain>0 ? Math.ceil(remain/1000) : 0;
}
function setTaskLast(taskId){ localStorage.setItem('task_last_'+taskId, String(Date.now())); }

              ${t.description ? `<div class="task-status">${esc(t.description)}</div>` : ''}
              ${cd>0 ? `
                <div class="cd-bar"><i style="width:${Math.min(100,(cd/(t.cooldown||1))*100)}%"></i></div>

async function doTask(taskId){
  if(!S.user){ nav('login'); return; }
  const tasks = await loadTasksConfig(true);
  const apis  = await loadNetworkApis(true);
  const task  = tasks.find(t=>t.id===taskId);
  if(!task){ toast('Nhiệm vụ không tồn tại.','err'); return; }

  const ap = apis[task.networkId];
  if(!ap || ap.enabled===false){ toast('Network chưa khả dụng.','err'); return; }

  const cd = getTaskCooldownRemaining(task.id, Number(task.cooldown||0));
  if(cd>0){ toast(`Chờ ${cd}s nữa.`,'warn'); return; }

  // THIẾT LẬP ID PHIÊN TỰ ĐỘNG & HASH CHỐNG BYPASS
  const sessionId = uid(18);
  const userIp = await getMyIp();
  const deviceHash = await getDeviceHash();
  const rewardAmt = Number(task.reward||0);
  
  // Mã hoá hash kết hợp: TaskID + SessionID + UserUID + IPv4 + RewardAmount
  const secureHash = await sha256(`${task.id}|${sessionId}|${S.user.uid}|${userIp}|${rewardAmt}`);
  const returnUrl = `${location.origin}${location.pathname}#/task-return/${sessionId}`;

  try{
    await setDoc(doc(db,'taskSessions',sessionId),{
      sessionId,
      userId: S.user.uid,
      userEmail: S.user.email || '',
      taskId: task.id,
      taskName: task.name || '',
      networkId: task.networkId,
      reward: rewardAmt,
      userIp,
      secureHash,
      deviceHash,
      returnUrl,
      status: 'pending',
      used: false, // Ngăn tái sử dụng 1 link nhiều lần
      createdAt: serverTimestamp(),
      expiresAt: new Date(Date.now() + 30*60*1000),
      createdAtMs: Date.now(),
    });
  }catch(e){
    console.error(e);
    toast('Không thể khởi tạo phiên làm việc bảo mật.','err');
    return;
  }

  localStorage.setItem('task_away_'+sessionId, '0');
  localStorage.removeItem('task_left_at_'+sessionId);

  if(_visibilityTrackerFn) document.removeEventListener('visibilitychange', _visibilityTrackerFn);
  _visibilityTrackerFn = ()=>{
    if(document.hidden){
      localStorage.setItem('task_left_at_'+sessionId, String(Date.now()));
    } else {
      const leftAt = Number(localStorage.getItem('task_left_at_'+sessionId)||0);
      if(leftAt){
        const away = (Date.now()-leftAt)/1000;
        const cur = Number(localStorage.getItem('task_away_'+sessionId)||0);
        localStorage.setItem('task_away_'+sessionId, String(cur+away));
        localStorage.removeItem('task_left_at_'+sessionId);
      }
    }
  };
  document.addEventListener('visibilitychange', _visibilityTrackerFn);

  // Link đích chứa tham số Session ID & Hash đã kiểm duyệt từ Firebase
  const targetWithHash = (task.targetUrl || `${location.origin}${location.pathname}#/tasks`) + 
    `?sid=${sessionId}&thash=${secureHash}`;

  const shortUrl = buildNetworkUrl(ap, targetWithHash, returnUrl);
  if(!shortUrl){ toast('Cấu hình quicklink network gặp sự cố.','err'); return; }

  setTaskLast(task.id);
  const w = window.open(shortUrl, '_blank', 'noopener');
  if(!w){ toast('Vui lòng cho phép mở popup trình duyệt.','warn'); }
  toast('Đã khởi tạo link nhiệm vụ bảo mật duy nhất!','ok');
  setTimeout(()=>showConfirmVượtDialog(sessionId, task), 600);
  if(S.route==='tasks') setTimeout(()=>loadTasksView(), 1500);
}

function showConfirmVượtDialog(sessionId, task){
  const back = document.createElement('div'); back.className='modal-back';
  const MIN_AWAY = 15;
  const renderContent = ()=>{
    const elapsedAway = Number(localStorage.getItem('task_away_'+sessionId)||0);
    const remain = Math.max(0, Math.ceil(MIN_AWAY - elapsedAway));
    return `<div class="modal" style="max-width:460px">
      <h3 style="margin-bottom:8px">Đã vượt link xong?</h3>
      <p style="font-size:.86rem;line-height:1.6;color:var(--text-2);margin-bottom:14px">Hoàn thành nhiệm vụ <b>${esc(task.name)}</b> ở tab mới. Nhấn "Xác nhận" để nhận <b style="color:var(--accent)">+${fmtVND(task.reward)}</b>.</p>
      ${remain>0
        ? `<div class="notice warn" style="margin-bottom:14px"><span>${icon('clock',16)}</span><span>Cần ở tab vượt link thêm <b id="wait-count">${remain}</b> giây để xác minh.</span></div>`
        : `<div class="notice ok" style="margin-bottom:14px"><span>${icon('check',16)}</span><span>Có thể xác nhận.</span></div>`}
      <div class="row gap-8" style="justify-content:flex-end">
        <button class="btn ghost" data-x="cancel">Để sau</button>
        <button class="btn accent" data-x="ok" ${remain>0?'disabled':''} id="confirm-btn">${remain>0?`Chờ ${remain}s`:'Xác nhận đã vượt'}</button>
      </div>
    </div>`;
  };
  back.innerHTML = renderContent();
  const close=v=>{ back.remove(); if(v) completeTask(sessionId); };
  back.addEventListener('click', e=>{
    if(e.target===back) return close(false);
    const b = e.target.closest('[data-x]'); if(!b) return;
    close(b.dataset.x==='ok');
  });
  $('#modal-root').appendChild(back);
  const timer = setInterval(()=>{
    const elapsedAway = Number(localStorage.getItem('task_away_'+sessionId)||0);
    const remain = Math.max(0, Math.ceil(MIN_AWAY - elapsedAway));
    const c = back.querySelector('#wait-count');
    const btn = back.querySelector('#confirm-btn');
    if(c) c.textContent = remain;
    if(btn){
      if(remain<=0){
        btn.removeAttribute('disabled'); btn.textContent = 'Xác nhận đã vượt';
        const notice = back.querySelector('.notice');
        if(notice){ notice.className='notice ok'; notice.innerHTML='<span>'+icon('check',16)+'</span><span>Có thể xác nhận.</span>'; }
        clearInterval(timer);
      } else btn.textContent = `Chờ ${remain}s`;
    }
    if(remain<=0) clearInterval(timer);
  }, 1000);
}

async function completeTask(sessionId){
  try{
    const sessionRef = doc(db,'taskSessions',sessionId);
    const snap = await getDoc(sessionRef);
    if(!snap.exists()){ toast('Phiên làm việc không tồn tại hoặc không hợp lệ.','err'); return; }
    const session = snap.data();
    
    if(session.userId !== S.user.uid){ toast('Lỗi truy cập tài khoản.','err'); return; }
    if(session.status === 'completed' || session.used === true){ 
      toast('Mã nhiệm vụ này đã được nhận thưởng trước đó! Vui lòng tạo lượt mới.','warn'); 
      return; 
    }

    // Kiểm tra Hash trùng khớp chống Bypass dữ liệu
    const currentIp = await getMyIp();
    const expectedHash = await sha256(`${session.taskId}|${sessionId}|${S.user.uid}|${session.userIp}|${session.reward}`);
    if(session.secureHash !== expectedHash){
      toast('Phát hiện dữ liệu nhiệm vụ bị can thiệp!','danger');
      return;
    }

    const awayTotal = Number(localStorage.getItem('task_away_'+sessionId)||0);
    const elapsed = (Date.now() - Number(session.createdAtMs || 0))/1000;
    if(awayTotal < 15 && elapsed < 15){
      toast(`Cần tương tác ở tab nhiệm vụ thêm ${Math.ceil(15-awayTotal)}s.`,'warn');
      return;
    }

    const reward = Number(session.reward||0);
    const taskId = session.taskId;
    const taskName = session.taskName||'';
    const networkId = session.networkId;

    await runTransaction(db, async tx=>{
      const wRef = doc(db,'wallets', S.user.uid);
      const wSnap = await tx.get(wRef);
      if(!wSnap.exists()) throw new Error('Ví không tồn tại.');
      const w = wSnap.data();
      const newBalance = Number(w.balance||0) + reward;

      tx.update(wRef, {
        balance: newBalance,
        lifetimeEarnings: Number(w.lifetimeEarnings||0) + reward,
        updatedAt: serverTimestamp(),
      });

      const compRef = doc(collection(db,'taskCompletions'));
      tx.set(compRef, {
        userId: S.user.uid,
        userEmail: S.user.email || '',
        taskId, taskName, networkId,
        reward,
        sessionId,
        userIp: currentIp,
        deviceHash: session.deviceHash || '',
        completedAt: serverTimestamp(),
      });

      const txRef = doc(collection(db,'transactions'));
      tx.set(txRef, {
        userId: S.user.uid,
        type: 'task_reward',
        amount: reward,
        source: 'task:'+taskId,
        note: `Thưởng nhiệm vụ: ${taskName}`,
        status: 'completed',
        createdAt: serverTimestamp(),
      });

      // ĐÁNH DẤU PHIÊN ĐÃ SỬ DỤNG - CHỈ DÙNG ĐƯỢC 1 LẦN
      tx.update(sessionRef, {
        status: 'completed',
        used: true,
        completedAt: serverTimestamp(),
      });
    });

    // CHIA HOA HỒNG REFERRAL TRỰC TIẾP TỰ ĐỘNG
    try{
      const refUser = S.profile?.referredBy;
      if(refUser && refUser !== S.user.uid){
        let rate = 10;
        try{
          const refCfgSnap = await getDoc(doc(db,'settings','referral'));
          if(refCfgSnap.exists()) rate = Number(refCfgSnap.data().taskRate||10);
        }catch{}
        const bonus = Math.floor(reward * rate / 100);
        if(bonus > 0){
          const rwRef = doc(db,'wallets', refUser);
          await runTransaction(db, async tx=>{
            const rwSnap = await tx.get(rwRef);
            if(!rwSnap.exists()) return;
            const rw = rwSnap.data();
            tx.update(rwRef, {
              balance: Number(rw.balance||0) + bonus,
              lifetimeEarnings: Number(rw.lifetimeEarnings||0) + bonus,
              updatedAt: serverTimestamp(),
            });
            const rTxRef = doc(collection(db,'transactions'));
            tx.set(rTxRef, {
              userId: refUser,
              type: 'referral_bonus',
              amount: bonus,
              source: 'ref:'+S.user.uid,
              note: `Hoa hồng 10% từ ${S.user.email}`,
              status: 'completed',
              createdAt: serverTimestamp(),
            });
            const reRef = doc(collection(db,'referralEarnings'));
            tx.set(reRef, {
              referrerId: refUser,
              referredId: S.user.uid,
              amount: bonus,
              source: 'task',
              createdAt: serverTimestamp(),
            });
          });
        }
      }
    }catch(e){ console.warn('ref bonus error', e); }

    localStorage.removeItem('task_away_'+sessionId);
    localStorage.removeItem('task_left_at_'+sessionId);
    if(_visibilityTrackerFn){ document.removeEventListener('visibilitychange', _visibilityTrackerFn); _visibilityTrackerFn = null; }
    toast(`+${fmtVND(reward)} đã vào ví!`, 'ok');
    if(_taskTickTimer) clearInterval(_taskTickTimer);
    setTimeout(()=>{ if(S.route==='tasks'){ render(); } }, 400);
  }catch(e){
    console.error(e);
    toast('Không thể hoàn tất nhiệm vụ: '+(e.message||e), 'err');
  }
}

      el.innerHTML = `

function statusBadge(s){
  const map={
    pending:['warn','Chờ duyệt'], reviewing:['warn','Đang xem'],
    approved:['ok','Đã duyệt'], rejected:['danger','Từ chối'],
    completed:['ok','Hoàn tất'], paid:['ok','Đã trả'],
    fraud:['danger','Gian lận'], processing:['warn','Đang xử lý'],
    open:['warn','Mở'], resolved:['ok','Đã xử lý'],
    active:['ok','Active'],
  };
  const [cls,label]=map[s]||['','—'];
  return `<span class="badge ${cls}">${label}</span>`;
}

async function handleWithdraw(){
  const amount=Number($('#w-amount').value||0);
  const bank=$('#w-bank').value.trim();
  const acc=$('#w-acc').value.trim();
  const accName=$('#w-name').value.trim();
  const err=$('#w-error'); const btn=$('#w-submit');
  err.classList.add('hidden');
  const balance=Number(S.wallet?.balance||0);
  const MIN=MIN_WITHDRAW;
  if(!bank){ err.textContent='Nhập tên ngân hàng.'; err.classList.remove('hidden'); return; }
  if(!acc){ err.textContent='Nhập số tài khoản.'; err.classList.remove('hidden'); return; }
  if(!accName){ err.textContent='Nhập chủ tài khoản.'; err.classList.remove('hidden'); return; }
  if(!Number.isFinite(amount)||amount<MIN){ err.textContent=`Tối thiểu ${fmtVND(MIN)}.`; err.classList.remove('hidden'); return; }
  if(amount>balance){ err.textContent='Vượt số dư.'; err.classList.remove('hidden'); return; }

  const ok=await confirmModal({
    title:'Xác nhận rút tiền',
    message:`Rút ${fmtVND(amount)} về:\n${bank} · ${acc} · ${accName}\n\nAdmin sẽ chuyển khoản thật trong 1-3 ngày.`,
    confirmText:'Gửi'
  });
  if(!ok) return;

  btn.disabled=true; const old=btn.innerHTML; btn.innerHTML='Đang gửi…';
  try{
    await addDoc(collection(db,'withdrawals'),{
      userId:S.user.uid, userEmail:S.user.email||'', amount, method:'bank',
      details:{ bankName:bank, accountNumber:acc, accountName:accName },
      status:'pending', note:'', txCode:'', createdAt:serverTimestamp(),
    });
    toast('Đã gửi yêu cầu.','ok'); $('#withdraw-form').reset(); loadWithdrawHistory();
  }catch(e){ err.textContent='Không thể gửi.'; err.classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.innerHTML=old; }
}

async function loadSellerDashboard(){
  if(!S.seller || S.seller.status!=='approved') return;
  try{
    const snap=await getDocs(query(collection(db,'sellerSales'), where('sellerId','==',S.user.uid), limit(400)));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    const today=startOfDay();
    let tOrders=0, tRev=0, tProfit=0, allProfit=0;
    const productMap={};
    const recent=[];
    rows.forEach(r=>{
      const d=toDate(r.createdAt); if(!d) return;
      const profit = Number(r.profit||0);
      const revenue = Number(r.revenue||0);
      allProfit += profit;
      if(d>=today){
        tOrders++; tRev+=revenue; tProfit+=profit;
        const k=r.productName||'—';
        productMap[k]=(productMap[k]||0)+profit;
      }
      recent.push(r);
    });
    recent.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
    set('sk-orders', fmtNum(tOrders));
    set('sk-rev', fmtVND(tRev));
    set('sk-profit', fmtVND(tProfit));
    set('sk-total-profit', fmtVND(allProfit));
    const top = Object.entries(productMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
    const topEl=document.getElementById('sel-top-products');
    if(topEl){
      topEl.innerHTML = top.length ? top.map(([name,p])=>`
        <div class="between" style="padding:10px 0;border-bottom:1px solid var(--border)">
          <span class="small" style="font-weight:600">${esc(name)}</span>
          <span class="mono" style="color:var(--ok);font-weight:650">+${fmtVND(p)}</span>
        </div>`).join('') : renderEmptyState('Chưa có dữ liệu','','box');
    }
    const rEl=document.getElementById('sel-recent-sales');
    if(rEl){
      rEl.innerHTML = recent.slice(0,6).length ? recent.slice(0,6).map(r=>`
        <div class="between" style="padding:14px 22px;border-bottom:1px solid var(--border)">
          <div>
            <div style="font-weight:600;font-size:.88rem">${esc(r.productName||'—')} × ${r.quantity||1}</div>
            <div class="tiny muted-3">${timeAgo(r.createdAt)}</div>
          </div>
          <div class="mono" style="font-weight:620;color:var(--ok)">+${fmtVND(r.profit||0)}</div>
        </div>`).join('') : renderEmptyState('Chưa có đơn','','receipt');
    }
  }catch(e){ console.error(e); }
}

async function loadSellerStats(range='1'){
  if(!S.seller || S.seller.status!=='approved') return;
  const now=new Date();
  let from=null;
  if(range==='1') from=startOfDay(now);
  else if(range==='15') from=daysAgo(15);
  else if(range==='30') from=daysAgo(30);
  else if(range==='90') from=daysAgo(90);
  try{
    const snap=await getDocs(query(collection(db,'sellerSales'), where('sellerId','==',S.user.uid), limit(600)));
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(r=>{ const d=toDate(r.createdAt); if(!d) return false; return !from || d>=from; });
    let orders=0, rev=0, profit=0;
    const byProduct={};
    rows.forEach(r=>{
      orders++; rev+=Number(r.revenue||0); profit+=Number(r.profit||0);
      const k=r.productName||'—';
      if(!byProduct[k]) byProduct[k]={qty:0,rev:0,profit:0};
      byProduct[k].qty+=Number(r.quantity||0);
      byProduct[k].rev+=Number(r.revenue||0);
      byProduct[k].profit+=Number(r.profit||0);
    });
    const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.textContent=v; };
    set('st-orders', fmtNum(orders));
    set('st-rev', fmtVND(rev));

async function buyLQKey(duration){
  if(!S.user) return;
  const available = S.lqKeys.filter(k=>k.duration===duration && k.status==='available');
  if(!available.length){ toast('Hết hàng cho loại này.','err'); return; }
  const key = available[Math.floor(Math.random()*available.length)];
  const price = Number(key.price||0);
  const balance = Number(S.wallet?.balance||0);
  if(balance < price){ toast(`Số dư không đủ. Cần ${fmtVND(price)}.`,'err'); return; }
  const d = LQ_DURATIONS.find(x=>x.id===duration);
  const ok = await confirmModal({
    title:'Xác nhận mua key',
    message:`Mua key ${d?.label||duration} với giá ${fmtVND(price)}? Số dư sẽ bị trừ ngay.`,
    confirmText:'Mua'
  });
  if(!ok) return;
  try{
    await runTransaction(db, async tx=>{
      const walletRef = doc(db,'wallets', S.user.uid);
      const keyRef = doc(db,'lq_keys', key.id);
      const wSnap = await tx.get(walletRef);
      const kSnap = await tx.get(keyRef);
      if(!kSnap.exists() || kSnap.data().status!=='available') throw new Error('Key đã bán.');
      const currentBalance = Number(wSnap.data().balance||0);
      if(currentBalance < price) throw new Error('Số dư không đủ.');
      tx.update(walletRef,{ balance: currentBalance - price });
      tx.update(keyRef,{ status:'sold', buyerId:S.user.uid, soldAt:serverTimestamp(), soldPrice:price });
      const logRef = doc(collection(db,'lq_purchases'));
      tx.set(logRef,{
        userId:S.user.uid, userEmail:S.user.email||'', keyId:key.id,
        keyCode:key.code, duration, price, createdAt:serverTimestamp(),
      });
      const txRef = doc(collection(db,'transactions'));
      tx.set(txRef,{
        userId:S.user.uid, type:'lq_purchase', amount:-price,
        source:'lq_market', status:'completed', createdAt:serverTimestamp(),
      });
    });
    toast('Mua key thành công!','ok');
    await loadLQKeys();
    render();
  }catch(e){
    toast(e.message || 'Không thể mua key.','err');
  }
}

function bindCalculator(){
  const viewsEl=document.querySelector('#calc-views');
  const netEl=document.querySelector('#calc-net');
  if(!viewsEl||!netEl) return;
  const compute=()=>{
    const views=Math.max(0,Number(viewsEl.value||0));
    const nets=S.networks.length?S.networks:DEFAULT_NETWORKS;
    const net=nets.find(n=>n.id===netEl.value)||nets[0];
    if(!net) return;
    const rate=Number(net.grossRate||0);
    const gross=views*rate;
    const share=(net.userSharePercent??60)/100;
    const user=gross*share;
    const plat=gross-user;
    const $r=document.querySelector('#c-rate');
    const $g=document.querySelector('#c-gross');
    const $u=document.querySelector('#c-user');
    const $p=document.querySelector('#c-plat');
    if($r)$r.textContent=fmtVND(rate);
    if($g)$g.textContent=fmtVND(gross);
    if($u)$u.textContent=fmtVND(user);
    if($p)$p.textContent=fmtVND(plat);
  };
  viewsEl.addEventListener('input',compute);
  netEl.addEventListener('change',compute);
  compute();
}

onAuthStateChanged(auth, async (user)=>{
  try{
    if(S.unsubProfile){ S.unsubProfile(); S.unsubProfile=null; }
    if(S.unsubWallet){ S.unsubWallet(); S.unsubWallet=null; }
    if(S.unsubSeller){ S.unsubSeller(); S.unsubSeller=null; }

    if(user){
      S.user=user;
      S.profile=await ensureProfile(user);
      S.wallet=await ensureWallet(user.uid);

      try{
        const sSnap=await getDoc(doc(db,'sellers',user.uid));
        S.seller = sSnap.exists() ? { id:sSnap.id, ...sSnap.data() } : null;
      }catch{ S.seller=null; }

      S.unsubWallet=onSnapshot(doc(db,'wallets',user.uid),(snap)=>{
        if(snap.exists()){
          S.wallet=snap.data();
          if(['dashboard','wallet','withdraw','lq-market','tasks'].includes(S.route)) render();
        }
      },()=>{});
      S.unsubProfile=onSnapshot(doc(db,'users',user.uid),(snap)=>{
        if(snap.exists()){
          S.profile=snap.data();
          if(S.route==='settings') render();
        }
      },()=>{});
      S.unsubSeller=onSnapshot(doc(db,'sellers',user.uid),(snap)=>{
        S.seller = snap.exists() ? { id:snap.id, ...snap.data() } : null;
        if(S.route.startsWith('seller')||S.route==='dashboard') render();
      },()=>{});

      await Promise.all([loadNetworks(), loadCampaigns(), loadLQKeys()]);
      if(['login','register',''].includes(S.route)) nav('dashboard');
    } else {
      S.user=null; S.profile=null; S.wallet=null; S.seller=null;
      await Promise.all([loadNetworks(), loadLQKeys()]);
    }
    S.ready=true; S.bootError=null;
    render();
  }catch(err){
    console.error('[Linkora] boot error',err);
    S.ready=true; S.bootError=err?.message||String(err);
    render();
  }
});
</script>
</body>
</html>
