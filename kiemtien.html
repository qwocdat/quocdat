<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Linkora — Nền tảng kiếm tiền từ lượt truy cập hợp lệ</title>
<meta name="description" content="Tạo shortlink, chia sẻ nội dung và nhận phần thưởng từ những lượt truy cập hợp lệ. Minh bạch rate, chống gian lận, thanh toán rõ ràng." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{min-height:100dvh;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img,svg,video{display:block;max-width:100%}
input,button,select,textarea{font:inherit;color:inherit;background:transparent;border:0;outline:0;-webkit-appearance:none;appearance:none;border-radius:0}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
ul,ol{list-style:none}
table{border-collapse:collapse;width:100%}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px var(--bg-soft) inset;-webkit-text-fill-color:var(--text)}
::selection{background:var(--accent);color:#fff}

/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --bg:#ffffff;
  --bg-soft:#fafafa;
  --bg-sunken:#f4f4f5;
  --text:#111111;
  --text-2:#666666;
  --text-3:#9a9a9a;
  --border:rgba(0,0,0,.08);
  --border-2:rgba(0,0,0,.14);
  --card:#ffffff;
  --glass:rgba(255,255,255,.72);
  --accent:#2563eb;
  --accent-2:#1d4ed8;
  --accent-soft:rgba(37,99,235,.08);
  --ok:#059669;
  --ok-soft:rgba(5,150,105,.10);
  --warn:#b45309;
  --warn-soft:rgba(180,83,9,.10);
  --danger:#dc2626;
  --danger-soft:rgba(220,38,38,.09);
  --shadow-xs:0 1px 2px rgba(0,0,0,.04);
  --shadow-sm:0 2px 8px rgba(0,0,0,.05);
  --shadow:0 8px 32px rgba(0,0,0,.07);
  --shadow-lg:0 20px 60px rgba(0,0,0,.10);
  --r-xs:10px;
  --r-sm:14px;
  --r:20px;
  --r-lg:26px;
  --r-xl:34px;
  --sidebar:264px;
  --maxw:1180px;
}
[data-theme="dark"]{
  --bg:#0a0a0a;
  --bg-soft:#101010;
  --bg-sunken:#151515;
  --text:#f5f5f5;
  --text-2:#a3a3a3;
  --text-3:#6b6b6b;
  --border:rgba(255,255,255,.10);
  --border-2:rgba(255,255,255,.18);
  --card:#101010;
  --glass:rgba(18,18,18,.72);
  --accent:#3b82f6;
  --accent-2:#60a5fa;
  --accent-soft:rgba(59,130,246,.14);
  --ok:#34d399;
  --ok-soft:rgba(52,211,153,.12);
  --warn:#fbbf24;
  --warn-soft:rgba(251,191,36,.12);
  --danger:#f87171;
  --danger-soft:rgba(248,113,113,.12);
  --shadow-xs:0 1px 2px rgba(0,0,0,.5);
  --shadow-sm:0 2px 8px rgba(0,0,0,.5);
  --shadow:0 8px 32px rgba(0,0,0,.55);
  --shadow-lg:0 20px 60px rgba(0,0,0,.7);
}

/* ============================================================
   BASE
   ============================================================ */
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:15px;
  letter-spacing:-0.005em;
}
h1,h2,h3,h4{letter-spacing:-0.03em;font-weight:700;line-height:1.12}
h1{font-size:clamp(2.1rem,5.2vw,3.9rem);font-weight:800}
h2{font-size:clamp(1.6rem,3.4vw,2.6rem)}
h3{font-size:1.15rem;letter-spacing:-0.02em}
p{color:var(--text-2)}
.small{font-size:.82rem}
.tiny{font-size:.74rem}
.muted{color:var(--text-2)}
.muted-3{color:var(--text-3)}
.mono{font-family:'SF Mono',ui-monospace,'JetBrains Mono',Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3)}
.center{text-align:center}
.hidden{display:none !important}
.row{display:flex;align-items:center}
.gap-6{gap:6px}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}.gap-24{gap:24px}
.wrap{flex-wrap:wrap}
.grow{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap-page{max-width:var(--maxw);margin:0 auto;padding:0 22px}
section{padding:88px 0}
section.tight{padding:56px 0}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border-radius:14px;
  font-size:.9rem;font-weight:600;letter-spacing:-0.01em;
  background:var(--text);color:var(--bg);
  border:1px solid transparent;
  transition:transform .18s cubic-bezier(.2,.7,.3,1), box-shadow .22s, background .18s, opacity .18s, border-color .18s;
  white-space:nowrap;user-select:none;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--border-2)}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.soft{background:var(--bg-sunken);color:var(--text);border-color:var(--border)}
.btn.soft:hover{background:var(--bg-soft);border-color:var(--border-2)}
.btn.accent{background:var(--accent);color:#fff}
.btn.accent:hover{background:var(--accent-2)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{height:36px;padding:0 14px;font-size:.82rem;border-radius:11px}
.btn.xs{height:30px;padding:0 10px;font-size:.76rem;border-radius:9px}
.btn.block{width:100%}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}

/* ============================================================
   INPUTS
   ============================================================ */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field > label{font-size:.8rem;font-weight:600;color:var(--text-2);letter-spacing:-0.005em}
.input,.select,.textarea{
  width:100%;height:46px;padding:0 15px;
  background:var(--bg-soft);
  border:1px solid var(--border);
  border-radius:14px;
  font-size:.9rem;color:var(--text);
  transition:border-color .18s, background .18s, box-shadow .18s;
}
.textarea{height:auto;min-height:110px;padding:13px 15px;resize:vertical;line-height:1.5}
.select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:40px;cursor:pointer;
}
.input:focus,.select:focus,.textarea:focus{
  border-color:var(--accent);background:var(--bg);
  box-shadow:0 0 0 4px var(--accent-soft);
}
.input::placeholder,.textarea::placeholder{color:var(--text-3)}
.input:disabled{opacity:.55;cursor:not-allowed}
.hint{font-size:.75rem;color:var(--text-3);line-height:1.45}

/* ============================================================
   CARDS
   ============================================================ */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:22px;
  transition:border-color .2s, box-shadow .25s, transform .25s;
}
.card.hoverable:hover{border-color:var(--border-2);box-shadow:var(--shadow);transform:translateY(-2px)}
.card.pad-lg{padding:30px}
.card.glass{
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
}
.card-title{font-size:.95rem;font-weight:650;letter-spacing:-0.015em}
.stat-value{font-size:1.85rem;font-weight:750;letter-spacing:-0.045em;line-height:1.05}
.stat-label{font-size:.76rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-3)}

.grid{display:grid;gap:16px}
.grid.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.grid.c3,.grid.c4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr}}

/* ============================================================
   BADGES
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:6px;
  height:24px;padding:0 10px;border-radius:8px;
  font-size:.72rem;font-weight:650;letter-spacing:0;
  background:var(--bg-sunken);color:var(--text-2);
  border:1px solid var(--border);
}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.badge.accent{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* ============================================================
   HEADER / NAV
   ============================================================ */
.site-header{
  position:sticky;top:0;z-index:60;
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--border);
}
.site-header .inner{
  max-width:var(--maxw);margin:0 auto;padding:0 22px;
  height:66px;display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.logo{display:flex;align-items:center;gap:10px;font-weight:750;font-size:1.02rem;letter-spacing:-0.03em}
.logo-mark{
  width:30px;height:30px;border-radius:9px;background:var(--text);color:var(--bg);
  display:grid;place-items:center;font-size:.86rem;font-weight:800;letter-spacing:-0.04em;
}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{
  padding:8px 13px;border-radius:10px;font-size:.86rem;font-weight:520;color:var(--text-2);
  transition:background .16s,color .16s;
}
.nav-links a:hover{background:var(--bg-soft);color:var(--text)}
.nav-links a.active{color:var(--text);font-weight:600}
@media(max-width:1000px){.nav-links{display:none}}

.icon-btn{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  border:1px solid var(--border);background:var(--bg-soft);color:var(--text-2);
  transition:background .18s,color .18s,border-color .18s;
}
.icon-btn:hover{background:var(--bg-sunken);color:var(--text);border-color:var(--border-2)}

/* ============================================================
   HERO
   ============================================================ */
.hero{padding:76px 0 60px;position:relative;overflow:hidden}
.hero-glow{
  position:absolute;top:-260px;left:50%;transform:translateX(-50%);
  width:900px;height:600px;pointer-events:none;
  background:radial-gradient(ellipse at center, var(--accent-soft), transparent 68%);
  opacity:.85;filter:blur(20px);
}
.hero .inner{position:relative;z-index:1}
.hero h1{max-width:16ch;margin-bottom:20px}
.hero .sub{font-size:1.08rem;max-width:56ch;line-height:1.55;color:var(--text-2)}

.pill{
  display:inline-flex;align-items:center;gap:8px;
  height:32px;padding:0 14px;border-radius:100px;
  background:var(--bg-soft);border:1px solid var(--border);
  font-size:.78rem;font-weight:550;color:var(--text-2);
}

/* Preview mock */
.preview{
  border:1px solid var(--border);border-radius:var(--r-xl);
  background:var(--card);box-shadow:var(--shadow-lg);
  overflow:hidden;position:relative;
}
.preview-bar{
  height:44px;display:flex;align-items:center;gap:7px;padding:0 16px;
  border-bottom:1px solid var(--border);background:var(--bg-soft);
}
.preview-bar i{width:9px;height:9px;border-radius:50%;background:var(--border-2);display:block}
.preview-body{padding:22px;display:grid;grid-template-columns:1.35fr 1fr;gap:16px}
@media(max-width:760px){.preview-body{grid-template-columns:1fr}}

.bars{display:flex;align-items:flex-end;gap:7px;height:120px;padding-top:12px}
.bars span{
  flex:1;background:var(--bg-sunken);border-radius:6px 6px 3px 3px;display:block;
  animation:grow .8s cubic-bezier(.2,.8,.3,1) backwards;
}
.bars span.on{background:var(--text)}
@keyframes grow{from{height:0 !important;opacity:0}}

/* ============================================================
   SECTION HEADS
   ============================================================ */
.sec-head{max-width:640px;margin-bottom:44px}
.sec-head h2{margin-bottom:14px}
.sec-head p{font-size:1.02rem;line-height:1.6}
.sec-head.center{margin-left:auto;margin-right:auto;text-align:center}

/* ============================================================
   STEPS
   ============================================================ */
.step{position:relative;padding-top:26px}
.step .num{
  font-size:.74rem;font-weight:700;letter-spacing:.14em;color:var(--text-3);
  padding-bottom:14px;border-top:1px solid var(--border);display:block;
}
.step h3{margin-bottom:9px}
.step p{font-size:.9rem;line-height:1.6}

/* ============================================================
   NETWORK ROWS
   ============================================================ */
.net-row{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:16px 20px;border-bottom:1px solid var(--border);
  transition:background .16s;
}
.net-row:last-child{border-bottom:0}
.net-row:hover{background:var(--bg-soft)}
.net-avatar{
  width:38px;height:38px;border-radius:11px;flex:none;
  display:grid;place-items:center;font-weight:750;font-size:.8rem;
  background:var(--bg-sunken);border:1px solid var(--border);color:var(--text-2);
}

/* ============================================================
   FAQ
   ============================================================ */
.faq-item{border-bottom:1px solid var(--border)}
.faq-q{
  width:100%;text-align:left;padding:20px 0;display:flex;justify-content:space-between;
  align-items:center;gap:16px;font-weight:600;font-size:.98rem;letter-spacing:-0.015em;
}
.faq-q .chev{transition:transform .25s;color:var(--text-3);flex:none}
.faq-item.open .chev{transform:rotate(180deg)}
.faq-a{max-height:0;overflow:hidden;transition:max-height .32s cubic-bezier(.2,.8,.3,1)}
.faq-a p{padding-bottom:20px;font-size:.9rem;line-height:1.65;max-width:70ch}

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer{border-top:1px solid var(--border);padding:56px 0 40px;background:var(--bg-soft)}
.foot-grid{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:36px}
@media(max-width:820px){.foot-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.foot-grid{grid-template-columns:1fr}}
.foot-col h4{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:14px;font-weight:650}
.foot-col a{display:block;padding:5px 0;font-size:.87rem;color:var(--text-2);transition:color .16s}
.foot-col a:hover{color:var(--text)}

/* ============================================================
   AUTH
   ============================================================ */
.auth-wrap{min-height:100dvh;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:900px){.auth-wrap{grid-template-columns:1fr}}
.auth-aside{
  background:var(--bg-soft);border-right:1px solid var(--border);
  padding:52px;display:flex;flex-direction:column;justify-content:space-between;
}
@media(max-width:900px){.auth-aside{display:none}}
.auth-main{display:grid;place-items:center;padding:44px 22px}
.auth-card{width:100%;max-width:412px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--bg-sunken);border-radius:14px;margin-bottom:26px}
.tabs button{
  flex:1;height:38px;border-radius:11px;font-size:.86rem;font-weight:600;color:var(--text-2);
  transition:background .2s,color .2s,box-shadow .2s;
}
.tabs button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow-xs)}

/* ============================================================
   APP SHELL
   ============================================================ */
.shell{display:grid;grid-template-columns:var(--sidebar) 1fr;min-height:100dvh}
.sidebar{
  border-right:1px solid var(--border);background:var(--bg-soft);
  padding:20px 14px;display:flex;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100dvh;overflow-y:auto;
}
.sidebar .brand{padding:8px 10px 20px}
.nav-sec{margin-top:14px}
.nav-sec-label{
  font-size:.68rem;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--text-3);padding:0 12px 8px;
}
.nav-item{
  display:flex;align-items:center;gap:11px;
  padding:10px 12px;border-radius:12px;
  font-size:.875rem;font-weight:520;color:var(--text-2);
  transition:background .16s,color .16s;cursor:pointer;
  width:100%;text-align:left;
}
.nav-item:hover{background:var(--bg-sunken);color:var(--text)}
.nav-item.on{background:var(--card);color:var(--text);font-weight:620;box-shadow:var(--shadow-xs);border:1px solid var(--border)}
.nav-item svg{flex:none;opacity:.75}
.nav-item.on svg{opacity:1}

.main{padding:30px 34px 80px;min-width:0}
@media(max-width:900px){
  .shell{grid-template-columns:1fr}
  .sidebar{
    position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;
    flex-direction:row;justify-content:space-around;padding:8px 6px;
    border-right:0;border-top:1px solid var(--border);z-index:80;
    background:var(--glass);backdrop-filter:blur(20px);
  }
  .sidebar .brand,.nav-sec-label,.sidebar .side-foot{display:none}
  .nav-sec{display:contents;margin:0}
  .nav-item{flex-direction:column;gap:3px;font-size:.65rem;padding:7px 4px;border-radius:12px;text-align:center}
  .nav-item.on{border:0;box-shadow:none;background:transparent;color:var(--accent)}
  .main{padding:20px 18px 110px}
}
.side-foot{margin-top:auto;padding-top:16px;border-top:1px solid var(--border)}

.page-head{margin-bottom:26px}
.page-head h1{font-size:1.65rem;margin-bottom:6px;font-weight:750}
.page-head p{font-size:.9rem}

/* Stat card */
.stat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;display:flex;flex-direction:column;gap:10px;
}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .icon{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;
  background:var(--bg-sunken);color:var(--text-2);border:1px solid var(--border);
}

/* Table */
.table-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--card)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table th{
  text-align:left;font-size:.72rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
  color:var(--text-3);padding:13px 18px;border-bottom:1px solid var(--border);background:var(--bg-soft);
  white-space:nowrap;
}
table td{padding:15px 18px;border-bottom:1px solid var(--border);font-size:.86rem;vertical-align:middle}
table tr:last-child td{border-bottom:0}
table tbody tr{transition:background .14s}
table tbody tr:hover{background:var(--bg-soft)}

/* Empty state */
.empty{
  padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;
}
.empty .icon{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  background:var(--bg-sunken);border:1px solid var(--border);color:var(--text-3);
}
.empty h3{font-size:1rem}
.empty p{font-size:.86rem;max-width:38ch}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--bg-sunken) 25%,var(--bg-soft) 50%,var(--bg-sunken) 75%);
  background-size:200% 100%;animation:shim 1.4s infinite;border-radius:8px;height:14px}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ============================================================
   TOAST / MODAL
   ============================================================ */
#toast-root{position:fixed;top:18px;right:18px;z-index:9999;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{
  pointer-events:auto;
  background:var(--card);border:1px solid var(--border-2);
  border-radius:15px;padding:13px 17px;min-width:250px;max-width:380px;
  box-shadow:var(--shadow-lg);font-size:.86rem;font-weight:520;
  display:flex;align-items:center;gap:11px;
  transform:translateX(120%);opacity:0;transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .34s;
}
.toast.show{transform:translateX(0);opacity:1}
.toast .bar{width:3px;height:22px;border-radius:2px;background:var(--text-3);flex:none}
.toast.ok .bar{background:var(--ok)}
.toast.err .bar{background:var(--danger)}

.modal-back{
  position:fixed;inset:0;z-index:9998;background:rgba(0,0,0,.45);
  backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;
  animation:fadeIn .2s;
}
@keyframes fadeIn{from{opacity:0}}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-lg);
  padding:28px;max-width:440px;width:100%;box-shadow:var(--shadow-lg);
  animation:pop .26s cubic-bezier(.2,.9,.3,1);
}
@keyframes pop{from{transform:scale(.96) translateY(10px);opacity:0}}
.modal h3{margin-bottom:10px}
.modal p{font-size:.9rem;line-height:1.6;margin-bottom:22px}

/* ============================================================
   CALCULATOR
   ============================================================ */
.calc{
  border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;
  background:var(--card);box-shadow:var(--shadow-sm);
}
.calc-grid{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:820px){.calc-grid{grid-template-columns:1fr}}
.calc-in{padding:30px;border-right:1px solid var(--border)}
@media(max-width:820px){.calc-in{border-right:0;border-bottom:1px solid var(--border)}}
.calc-out{padding:30px;background:var(--bg-soft);display:flex;flex-direction:column;gap:16px;justify-content:center}
.calc-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.calc-line .v{font-size:1.4rem;font-weight:750;letter-spacing:-0.04em}
.calc-line.big .v{font-size:2rem}

.link{color:var(--accent);font-weight:550;transition:opacity .16s}

.copy-field{

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
  ));
}
function fmtVND(n){
  const v = Number(n || 0);
  return v.toLocaleString('vi-VN') + 'đ';
}
function fmtNum(n){ return Number(n||0).toLocaleString('vi-VN'); }
function fmtDate(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if(isNaN(d)) return '—';
  return d.toLocaleDateString('vi-VN', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function fmtDateTime(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  if(isNaN(d)) return '—';
  return d.toLocaleString('vi-VN', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function timeAgo(ts){
  if(!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = (Date.now() - d.getTime())/1000;
  if(s < 60) return 'vừa xong';
  if(s < 3600) return Math.floor(s/60) + ' phút trước';
  if(s < 86400) return Math.floor(s/3600) + ' giờ trước';
  if(s < 2592000) return Math.floor(s/86400) + ' ngày trước';
  return fmtDate(ts);
}
function uid(len=10){
  const c = 'abcdefghijkmnpqrstuvwxyz23456789';
  let s = '';
  const a = crypto.getRandomValues(new Uint8Array(len));
  for(let i=0;i<len;i++) s += c[a[i] % c.length];
  return s;
}
function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }
function safeUrl(v){
  try{
    const u = new URL(v);
    if(!['http:','https:'].includes(u.protocol)) return null;
    return u.toString();
  }catch{ return null; }
}
async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function toast(msg, type='info'){
  const root = $('#toast-root');
  if(!root) return;
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `<span class="bar"></span><span>${esc(msg)}</span>`;
  root.appendChild(t);
  requestAnimationFrame(()=> t.classList.add('show'));
  setTimeout(()=>{
    t.classList.remove('show');
    setTimeout(()=> t.remove(), 350);
  }, 3400);
}

function confirmModal({title, message, confirmText='Xác nhận', cancelText='Huỷ', danger=false}){
  return new Promise(resolve => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true">
        <h3>${esc(title)}</h3>
        <p>${esc(message)}</p>
        <div class="btn-group" style="justify-content:flex-end">
          <button class="btn ghost" data-x="cancel">${esc(cancelText)}</button>
          <button class="btn ${danger?'danger':''}" data-x="ok">${esc(confirmText)}</button>
        </div>
      </div>`;
    const close = (v)=>{ back.remove(); resolve(v); };
    back.addEventListener('click', e=>{
      if(e.target === back) close(false);
      const b = e.target.closest('[data-x]');
      if(!b) return;
      close(b.dataset.x === 'ok');
    });
    document.addEventListener('keydown', function onKey(e){
      if(e.key === 'Escape'){ close(false); document.removeEventListener('keydown', onKey); }
    });
    $('#modal-root').appendChild(back);
  });
}

async function ensureProfile(user){
  const ref = doc(db, 'users', user.uid);
  const snap = await getDoc(ref);
  if(snap.exists()) return snap.data();

  // bootstrap: nếu hệ thống chưa có admin nào -> user đầu tiên là superadmin
  let role = 'user';
  try{
    const adminQ = query(collection(db,'users'), where('role','in',['admin','superadmin']), limit(1));
    const adminSnap = await getDocs(adminQ);
    if(adminSnap.empty) role = 'superadmin';
  }catch(e){ /* ignore */ }

  const profile = {
    uid: user.uid,
    email: user.email || '',
    displayName: user.displayName || (user.email||'').split('@')[0],
    role,
    referralCode: uid(8).toUpperCase(),
    referredBy: null,
    status: 'active',
    createdAt: serverTimestamp(),
  };
  await setDoc(ref, profile);
  return profile;
}

async function ensureWallet(uidVal){
  const ref = doc(db, 'wallets', uidVal);
  const snap = await getDoc(ref);
  if(snap.exists()) return snap.data();
  const w = {
    balance: 0, pendingBalance: 0, lifetimeEarnings: 0,
    withdrawnAmount: 0, frozenBalance: 0, currency: 'VND',
    updatedAt: serverTimestamp(),
  };
  await setDoc(ref, w);
  return w;
}

async function loadNetworks(force=false){
  if(S.networks.length && !force) return S.networks;
  try{
    const snap = await getDocs(collection(db, 'networks'));
    if(snap.empty){
      // seed defaults (best-effort)
      for(const n of DEFAULT_NETWORKS){
        try{ await setDoc(doc(db,'networks',n.id), {...n, createdAt: serverTimestamp()}); }catch(e){}
      }
      S.networks = [...DEFAULT_NETWORKS];
    } else {
      S.networks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
  }catch(e){
    S.networks = [...DEFAULT_NETWORKS];
  }
  return S.networks;
}

async function loadCampaigns(){
  try{
    const q = query(collection(db,'creatorCampaigns'), where('status','==','active'), limit(24));
    const snap = await getDocs(q);
    S.campaigns = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  }catch(e){ S.campaigns = []; }
  return S.campaigns;
}

function parseHash(){
  const h = (location.hash || '#/').replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  return { route: parts[0] || 'home', param: parts[1] || null };
}

function nav(path){ location.hash = '#/' + path.replace(/^\/+/, ''); }

function render(){
  const { route, param } = parseHash();
  S.route = route; S.param = param;
  const appEl = $('#app');

  // Redirect route (public)
  if(route === 's' && param){ return renderRedirect(appEl, param); }

  if(!S.ready){ appEl.innerHTML = renderBoot(); return; }
  if(S.bootError){ appEl.innerHTML = renderBootError(); return; }

  const isDash = ['dashboard','links','create','statistics','creator','wallet','withdraw',
                  'transactions','referrals','notifications','settings','support',
                  'admin','admin-networks','admin-rates','admin-creator','admin-withdrawals',
                  'admin-fraud','admin-users','admin-audit','admin-economics'].includes(route);

  if(isDash && !S.user){ nav('login'); return; }

  if(route === 'login' || route === 'register'){
    if(S.user){ nav('dashboard'); return; }
    appEl.innerHTML = renderAuth(route);
    return;
  }

  const legalRoutes = ['terms','privacy','anti-fraud','payout-policy','content-policy',
                       'cookie-policy','disclaimer','refund-policy','creator-policy','network-policy'];
  if(legalRoutes.includes(route)){
    appEl.innerHTML = renderLegal(route);
    return;
  }

  if(route === 'rates'){ appEl.innerHTML = renderRatesPage(); return; }

  if(route.startsWith('admin')){
    if(!isAdmin()){ toast('Bạn không có quyền truy cập trang quản trị.', 'err'); nav('dashboard'); return; }
    appEl.innerHTML = renderAdmin(route);
    return;
  }

  if(isDash){ appEl.innerHTML = renderDashboard(route); return; }

  appEl.innerHTML = renderLanding();
}

function isAdmin(){
  return S.profile && ['admin','superadmin','finance','moderator','support','analyst'].includes(S.profile.role);
}
function isSuperAdmin(){
  return S.profile && ['admin','superadmin'].includes(S.profile.role);
}

function authError(msg){
  const el = $('#auth-error');
  if(!el) return;
  if(!msg){ el.classList.add('hidden'); el.textContent=''; return; }
  el.classList.remove('hidden');
  el.textContent = msg;
}

async function handleAuthSubmit(mode){
  const email = $('#a-email')?.value.trim() || '';
  const pass  = $('#a-pass')?.value || '';
  const name  = $('#a-name')?.value.trim() || '';
  const btn   = $('#auth-submit');

  authError('');
  if(!isEmail(email)) return authError('Email không hợp lệ.');
  if(pass.length < 6) return authError('Mật khẩu phải có ít nhất 6 ký tự.');

  btn.disabled = true;
  btn.textContent = mode==='login' ? 'Đang đăng nhập…' : 'Đang tạo tài khoản…';

  try{
    if(mode === 'login'){
      await signInWithEmailAndPassword(auth, email, pass);
      toast('Đăng nhập thành công.', 'ok');
    } else {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      if(name) await updateProfile(cred.user, { displayName: name });
      toast('Tài khoản đã được tạo.', 'ok');
    }
    nav('dashboard');
  }catch(e){
    const map = {
      'auth/invalid-credential':'Email hoặc mật khẩu không đúng.',
      'auth/wrong-password':'Email hoặc mật khẩu không đúng.',
      'auth/user-not-found':'Tài khoản không tồn tại.',
      'auth/email-already-in-use':'Email này đã được sử dụng.',
      'auth/weak-password':'Mật khẩu quá yếu.',
      'auth/too-many-requests':'Quá nhiều lần thử. Vui lòng đợi một lát.',
      'auth/network-request-failed':'Lỗi kết nối mạng.',
      'auth/invalid-email':'Email không hợp lệ.',
      'auth/operation-not-allowed':'Phương thức đăng nhập chưa được bật trong Firebase Console.',
    };
    authError(map[e.code] || 'Không thể xác thực. Vui lòng thử lại.');
  }finally{
    btn.disabled = false;
    btn.textContent = mode==='login' ? 'Đăng nhập' : 'Tạo tài khoản';
  }
}

async function handleCreateLink(){
  const url = $('#cl-url')?.value.trim() || '';
  const net = $('#cl-net')?.value || 'auto';
  const alias = ($('#cl-alias')?.value || '').trim().toLowerCase();
  const err = $('#cl-error');
  const btn = $('#cl-submit');

  err.classList.add('hidden');

  const safe = safeUrl(url);
  if(!safe){
    err.textContent = 'URL không hợp lệ. Chỉ chấp nhận http hoặc https.';
    err.classList.remove('hidden');
    return;
  }
  if(alias && !/^[a-z0-9-]{3,32}$/.test(alias)){
    err.textContent = 'Alias chỉ được chứa chữ thường, số và dấu gạch ngang (3–32 ký tự).';
    err.classList.remove('hidden');
    return;
  }

  btn.disabled = true;
  const old = btn.innerHTML;
  btn.innerHTML = 'Đang tạo…';

  try{
    const slug = alias || uid(7);
    // Kiểm tra alias trùng
    const dupQ = query(collection(db,'shortlinks'), where('slug','==',slug), limit(1));
    const dup = await getDocs(dupQ);
    if(!dup.empty){
      err.textContent = 'Alias này đã được sử dụng. Vui lòng chọn alias khác.';
      err.classList.remove('hidden');
      return;
    }

    const ref = await addDoc(collection(db,'shortlinks'), {
      slug,
      originalUrl: safe,
      urlHash: await sha256(safe),
      networkId: net,
      userId: S.user.uid,
      clicks: 0,
      validViews: 0,
      invalidViews: 0,
      revenue: 0,
      status: 'active',
      createdAt: serverTimestamp(),
    });

    const shortUrl = `${location.origin}${location.pathname}#/s/${slug}`;
    $('#cl-result').classList.remove('hidden');
    $('#cl-result').innerHTML = `
      <div class="notice" style="margin-bottom:16px">
        <span>${icon('check',16)}</span>
        <span>Đã tạo shortlink.</span>
      </div>
      <div class="field" style="margin-bottom:12px">
        <label>Short URL</label>
        <div class="copy-field">
          <input readonly value="${esc(shortUrl)}" id="short-out" />
          <button class="btn xs" data-copy="#short-out" type="button">${icon('copy',14)} Copy</button>
        </div>
      </div>
      <div class="small muted" style="line-height:1.6">
        Network: <strong>${esc(net)}</strong> · Trạng thái: <span class="badge ok">active</span>
      </div>
      <div class="divider"></div>
      <p class="tiny muted-3">
        Để lượt truy cập được ghi nhận, cần cấu hình Cloud Function xử lý route <span class="mono">/s/:slug</span>
        cùng kiểm tra IP/device/cooldown server-side.
      </p>`;
    toast('Đã tạo shortlink.', 'ok');
  }catch(e){
    err.textContent = 'Không thể tạo shortlink. Vui lòng thử lại.';
    err.classList.remove('hidden');
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

async function handleCreatorSubmit(){
  const platform = $('#cr-platform').value;
  const url = $('#cr-url').value.trim();
  const title = $('#cr-title').value.trim();
  const views = Number($('#cr-views').value || 0);
  const likes = Number($('#cr-likes').value || 0);
  const comments = Number($('#cr-comments').value || 0);
  const desc = $('#cr-desc').value.trim();
  const err = $('#cr-error');
  const btn = $('#cr-submit');

  err.classList.add('hidden');
  const safe = safeUrl(url);
  if(!safe){ err.textContent='URL không hợp lệ.'; err.classList.remove('hidden'); return; }
  if(!title){ err.textContent='Vui lòng nhập tiêu đề.'; err.classList.remove('hidden'); return; }
  if([views,likes,comments].some(v=>v<0 || !Number.isFinite(v))){
    err.textContent='Số liệu không hợp lệ.'; err.classList.remove('hidden'); return;
  }

  btn.disabled = true;
  const old = btn.innerHTML;
  btn.innerHTML = 'Đang gửi…';

  try{
    // kiểm tra trùng URL
    const dupQ = query(collection(db,'creatorSubmissions'), where('urlHash','==', await sha256(safe)), limit(1));
    const dup = await getDocs(dupQ);
    if(!dup.empty){
      err.textContent = 'URL này đã được nộp trước đó.';
      err.classList.remove('hidden');
      return;
    }

    // fraud signals cơ bản (client-side, cần xác thực thêm server-side)
    const reasons = [];
    let score = 0;
    if(views > 0 && likes > views * 0.6){ score += 25; reasons.push('Tỷ lệ like/view bất thường'); }
    if(views > 0 && comments > views * 0.4){ score += 20; reasons.push('Tỷ lệ comment/view bất thường'); }
    if(views > 1_000_000){ score += 15; reasons.push('Số view rất lớn cần xác minh'); }

    await addDoc(collection(db,'creatorSubmissions'), {
      userId: S.user.uid,
      userEmail: S.user.email || '',
      platform, url: safe, urlHash: await sha256(safe),
      title, description: desc,
      currentViews: views, likes, comments,
      submittedAt: serverTimestamp(),
      status: 'pending',
      fraudScore: score,
      fraudReasons: reasons,
      reward: 0,
    });

    toast('Submission đã được gửi. Chờ admin xác minh.', 'ok');
    $('#creator-form').reset();
    loadSubmissions();
  }catch(e){
    err.textContent = 'Không thể gửi submission. Vui lòng thử lại.';
    err.classList.remove('hidden');
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

function statusBadge(s){
  const map = {
    pending:['warn','Chờ duyệt'], reviewing:['warn','Đang xem'],
    approved:['ok','Đã duyệt'], rejected:['danger','Từ chối'],
    completed:['ok','Hoàn tất'], paid:['ok','Đã trả'],
    fraud:['danger','Gian lận'],

function bindWithdrawMethod(){
  const sel = $('#w-method');
  if(!sel) return;
  const update = ()=>{
    const v = sel.value;
    $('#wm-bank').classList.toggle('hidden', v !== 'bank');
    $('#wm-card').classList.toggle('hidden', v !== 'mobile_card');
    $('#wm-other').classList.toggle('hidden', v !== 'other');
  };
  sel.addEventListener('change', update);
  update();
}

async function handleWithdraw(){
  const method = $('#w-method').value;
  const amount = Number($('#w-amount').value || 0);
  const err = $('#w-error');
  const btn = $('#w-submit');

  err.classList.add('hidden');
  const balance = Number(S.wallet?.balance || 0);
  const MIN = 50000;

  if(!Number.isFinite(amount) || amount < MIN){
    err.textContent = `Số tiền tối thiểu là ${fmtVND(MIN)}.`;
    err.classList.remove('hidden'); return;
  }
  if(amount > balance){
    err.textContent = 'Số tiền vượt quá số dư khả dụng.';
    err.classList.remove('hidden'); return;
  }

  let details = {};
  if(method === 'bank'){
    const bank = $('#w-bank').value.trim();
    const acc = $('#w-acc').value.trim();
    const name = $('#w-name').value.trim();
    if(!bank || !acc || !name){
      err.textContent = 'Vui lòng điền đầy đủ thông tin ngân hàng.';
      err.classList.remove('hidden'); return;
    }
    details = { bankName: bank, accountNumber: acc, accountName: name };
  } else if(method === 'mobile_card'){
    const telco = $('#w-telco').value;
    if(!telco){
      err.textContent = 'Phương thức thẻ chưa được admin cấu hình nhà cung cấp.';
      err.classList.remove('hidden'); return;
    }
    details = { telco };
  } else {
    const note = $('#w-other').value.trim();
    if(!note){ err.textContent='Vui lòng mô tả phương thức nhận tiền.'; err.classList.remove('hidden'); return; }
    details = { note };
  }

  const ok = await confirmModal({
    title: 'Xác nhận yêu cầu rút tiền',
    message: `Bạn yêu cầu rút ${fmtVND(amount)} qua ${method === 'bank' ? 'chuyển khoản ngân hàng' : method === 'mobile_card' ? 'thẻ điện thoại' : 'phương thức khác'}. Yêu cầu sẽ được xem xét thủ công.`,
    confirmText: 'Gửi yêu cầu'
  });
  if(!ok) return;

  btn.disabled = true;
  const old = btn.innerHTML;
  btn.innerHTML = 'Đang gửi…';

  try{
    await addDoc(collection(db,'withdrawals'), {
      userId: S.user.uid,
      userEmail: S.user.email || '',
      amount,
      method,
      details,
      status: 'pending',
      note: '',
      txCode: '',
      createdAt: serverTimestamp(),
    });

    toast('Yêu cầu rút tiền đã được gửi.', 'ok');
    $('#withdraw-form').reset();
    bindWithdrawMethod();
    loadWithdrawHistory();
  }catch(e){
    err.textContent = 'Không thể gửi yêu cầu. Vui lòng thử lại.';
    err.classList.remove('hidden');
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.innerHTML = old;
  }
}

async function loadWithdrawHistory(){
  const box = $('#withdraw-history');
  if(!box) return;
  try{
    const q = query(collection(db,'withdrawals'), where('userId','==',S.user.uid), limit(30));
    const snap = await getDocs(q);
    const rows = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    if(!rows.length){
      box.innerHTML = renderEmptyState('Chưa có yêu cầu','','cash');
      return;

    box.innerHTML = rows.map(r=>`

async function editNetwork(id){
  const nets = S.networks.length ? S.networks : DEFAULT_NETWORKS;
  const n = nets.find(x=>x.id===id);
  if(!n) return;

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal" style="max-width:520px">
      <h3 style="margin-bottom:6px">${esc(n.name)}</h3>
      <p class="small" style="margin-bottom:20px">Chỉnh cấu hình rate và giới hạn. Mọi thay đổi rate sẽ được ghi vào rate history.</p>
      <div class="grid c2" style="gap:14px">
        <div class="field">
          <label>Gross rate (VND)</label>
          <input class="input" id="en-rate" type="number" min="0" value="${n.grossRate||0}" />
        </div>
        <div class="field">
          <label>User share (%)</label>
          <input class="input" id="en-user" type="number" min="0" max="100" value="${n.userSharePercent??60}" />
        </div>
        <div class="field">
          <label>Min payout (VND)</label>
          <input class="input" id="en-min" type="number" min="0" value="${n.minPayout||50000}" />
        </div>
        <div class="field">
          <label>Max views / IP / ngày</label>
          <input class="input" id="en-ip" type="number" min="1" value="${n.maxViewsPerIpPerDay??1}" />
        </div>
        <div class="field">
          <label>Max views / device / ngày</label>
          <input class="input" id="en-dev" type="number" min="1" value="${n.maxViewsPerDevicePerDay??1}" />
        </div>
        <div class="field">
          <label>Cooldown (giây)</label>
          <input class="input" id="en-cd" type="number" min="0" value="${n.cooldownSeconds??86400}" />
        </div>
      </div>
      <div class="field">
        <label>Trạng thái</label>
        <select class="select" id="en-enabled">
          <option value="true" ${n.enabled!==false?'selected':''}>Bật</option>
          <option value="false" ${n.enabled===false?'selected':''}>Tắt</option>
        </select>
      </div>
      <div class="field">
        <label>Lý do thay đổi (bắt buộc cho audit log)</label>
        <input class="input" id="en-reason" type="text" placeholder="VD: Network rate changed" maxlength="160" />
      </div>
      <div class="btn-group" style="justify-content:flex-end;margin-top:8px">
        <button class="btn ghost" data-x="cancel">Huỷ</button>
        <button class="btn" data-x="save">Lưu thay đổi</button>
      </div>
    </div>`;

  const close = ()=> back.remove();
  back.addEventListener('click', async e=>{
    if(e.target === back) return close();
    const b = e.target.closest('[data-x]');
    if(!b) return;
    if(b.dataset.x === 'cancel') return close();

    const newRate = Number($('#en-rate').value||0);
    const userShare = Number($('#en-user').value||60);
    const platformShare = 100 - userShare;
    const minPayout = Number($('#en-min').value||50000);
    const maxIp = Number($('#en-ip').value||1);
    const maxDev = Number($('#en-dev').value||1);
    const cd = Number($('#en-cd').value||86400);
    const enabled = $('#en-enabled').value === 'true';
    const reason = $('#en-reason').value.trim();

    if(!reason){ toast('Vui lòng nhập lý do thay đổi để ghi audit log.', 'err'); return; }
    if(userShare < 0 || userShare > 100){ toast('User share phải trong khoảng 0–100.', 'err'); return; }

    try{
      await setDoc(doc(db,'networks',id), {
        ...n,
        grossRate: newRate,
        userSharePercent: userShare,
        platformSharePercent: platformShare,
        minPayout, maxViewsPerIpPerDay: maxIp, maxViewsPerDevicePerDay: maxDev,
        cooldownSeconds: cd, enabled,
        updatedAt: serverTimestamp(),
      }, { merge:true });

      if(Number(n.grossRate) !== newRate){
        await addDoc(collection(db,'rateHistory'), {
          networkId: id,
          oldRate: Number(n.grossRate||0),
          newRate,
          changedBy: S.user.uid,
          changedAt: serverTimestamp(),
          reason,
        });
      }

      await addDoc(collection(db,'auditLogs'), {
        adminId: S.user.uid,
        action: 'ADMIN_UPDATED_NETWORK',
        targetType: 'network',
        targetId: id,
        oldValue: { rate: n.grossRate, userShare: n.userSharePercent, enabled: n.enabled },
        newValue: { rate: newRate, userShare, enabled },
        reason,
        timestamp: serverTimestamp(),
      });

      toast('Đã cập nhật network.', 'ok');
      close();
      await loadNetworks(true);
      render();
    }catch(err){
      console.error(err);
      toast('Không thể cập nhật network.', 'err');
    }
  });

  $('#modal-root').appendChild(back);
}

/* ============================================================
   GLOBAL EVENTS (delegation)
   ============================================================ */
document.addEventListener('click', async (e)=>{
  const t = e.target;

  // theme toggle
  const themeBtn = t.closest('[data-theme-toggle]');
  if(themeBtn){
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(THEME_KEY, next);
    return;
  }

  // goto
  const goBtn = t.closest('[data-goto]');
  if(goBtn){
    nav(goBtn.dataset.goto);
    return;
  }

  // scroll
  const sc = t.closest('[data-scroll]');
  if(sc){
    const target = document.querySelector(sc.dataset.scroll);
    if(target) target.scrollIntoView({behavior:'smooth'});
    return;
  }

  // copy from input
  const cp = t.closest('[data-copy]');
  if(cp){
    const inp = document.querySelector(cp.dataset.copy);
    if(inp){
      try{ await navigator.clipboard.writeText(inp.value); toast('Đã copy.', 'ok'); }
      catch{ toast('Không thể copy.', 'err'); }
    }
    return;
  }

  // copy text
  const cpt = t.closest('[data-copy-text]');
  if(cpt){
    try{ await navigator.clipboard.writeText(cpt.dataset.copyText); toast('Đã copy.', 'ok'); }
    catch{ toast('Không thể copy.', 'err'); }
    return;
  }

  // faq
  const faqQ = t.closest('[data-faq]');
  if(faqQ){
    const item = faqQ.parentElement;
    const ans = item.querySelector('.faq-a');
    const isOpen = item.classList.contains('open');
    // close all
    document.querySelectorAll('.faq-item.open').forEach(x=>{
      x.classList.remove('open');
      x.querySelector('.faq-a').style.maxHeight = '0px';
    });
    if(!isOpen){
      item.classList.add('open');
      ans.style.maxHeight = ans.scrollHeight + 'px';
    }
    return;
  }

  // actions
  const act = t.closest('[data-action]');
  if(act){
    const a = act.dataset.action;
    if(a === 'logout'){
      const ok = await confirmModal({title:'Đăng xuất?', message:'Bạn sẽ cần đăng nhập lại để tiếp tục.', confirmText:'Đăng xuất'});
      if(ok) await signOut(auth);
      return;
    }
    if(a === 'delete-link'){ deleteLink(act.dataset.id); return; }
    if(a === 'edit-network'){ editNetwork(act.dataset.id); return; }
    if(a === 'approve-sub'){ approveSubmission(act.dataset.id); return; }
    if(a === 'reject-sub'){ rejectSubmission(act.dataset.id); return; }
    if(a === 'approve-wd'){ approveWithdrawal(act.dataset.id); return; }
    if(a === 'reject-wd'){ rejectWithdrawal(act.dataset.id); return; }
  }
});

/* ============================================================
   ROUTE-SPECIFIC DATA LOADING (after render)
   ============================================================ */
const _origRender = render;
render = function(){
  _origRender();
  // post-render hooks
  setTimeout(()=>{
    const r = S.route;
    if(r === 'links') loadLinks();
    if(r === 'creator') loadSubmissions();
    if(r === 'wallet') loadRecentTx('#wallet-tx');
    if(r === 'withdraw'){ bindWithdrawMethod(); loadWithdrawHistory(); }
    if(r === 'transactions') loadTransactions();
    if(r === 'notifications') loadNotifications();
    if(r === 'support') loadTickets();
    if(r === 'dashboard') loadRecentTx('#recent-tx');
    if(r === 'admin-networks' && S.networks.length === 0) loadNetworks(true).then(()=>render());
    if(r === 'admin-rates') loadRateHistory();
    if(r === 'admin-creator') loadAdminCreator();
    if(r === 'admin-withdrawals') loadAdminWithdrawals();
    if(r === 'admin-fraud') loadAdminFraud();
    if(r === 'admin-users') loadAdminUsers();
    if(r === 'admin-audit') loadAdminAudit();
    if(r === 'admin' && S.networks.length === 0) loadNetworks(true).then(()=>render());

    // calculator binding
    bindCalculator();
    // settings binding
    bindSettings();
  }, 0);
};

function bindCalculator(){
  const viewsEl = document.querySelector('#calc-views');
  const netEl = document.querySelector('#calc-net');
  if(!viewsEl || !netEl) return;

  const compute = ()=>{
    const views = Math.max(0, Number(viewsEl.value || 0));
    const netId = netEl.value;
    const nets = S.networks.length ? S.networks : DEFAULT_NETWORKS;
    const net = nets.find(n=>n.id === netId) || nets[0];
    if(!net) return;
    const rate = Number(net.grossRate || 0);
    const gross = views * rate;
    const userShare = (net.userSharePercent ?? 60) / 100;
    const user = gross * userShare;
    const plat = gross - user;
    const $r = document.querySelector('#c-rate');
    const $g = document.querySelector('#c-gross');
    const $u = document.querySelector('#c-user');
    const $p = document.querySelector('#c-plat');
    if($r) $r.textContent = fmtVND(rate);
    if($g) $g.textContent = fmtVND(gross);
    if($u) $u.textContent = fmtVND(user);
    if($p) $p.textContent = fmtVND(plat);
  };

  viewsEl.addEventListener('input', compute);
  netEl.addEventListener('change', compute);
  compute();
}

function bindSettings(){
  const btn = document.querySelector('#set-save');
  if(btn){
    btn.addEventListener('click', saveSettings);
  }
}

/* ============================================================
   AUTH STATE
   ============================================================ */
onAuthStateChanged(auth, async (user)=>{
  try{
    if(S.unsubProfile){ S.unsubProfile(); S.unsubProfile = null; }
    if(S.unsubWallet){ S.unsubWallet(); S.unsubWallet = null; }

    if(user){
      S.user = user;
      S.profile = await ensureProfile(user);
      S.wallet = await ensureWallet(user.uid);

      // realtime wallet
      S.unsubWallet = onSnapshot(doc(db,'wallets', user.uid), (snap)=>{
        if(snap.exists()){
          S.wallet = snap.data();
          if(['dashboard','wallet','withdraw'].includes(S.route)) render();
        }
      }, ()=>{ /* ignore */ });

      // realtime profile
      S.unsubProfile = onSnapshot(doc(db,'users', user.uid), (snap)=>{
        if(snap.exists()){
          S.profile = snap.data();
          if(S.route === 'settings') render();
        }
      }, ()=>{ /* ignore */ });

      await Promise.all([loadNetworks(), loadCampaigns()]);

      if(['login','register',''].includes(S.route)) nav('dashboard');
    } else {
      S.user = null; S.profile = null; S.wallet = null;
      if(S.route.startsWith('admin')) nav('home');
    }
    S.ready = true;
    S.bootError = null;
    render();
  }catch(err){
    console.error('[Linkora] boot error', err);
    S.ready = true;
    S.bootError = err?.message || String(err);
    render();
  }
});

/* ============================================================
   FIRESTORE SECURITY RULES (mẫu — copy vào Firebase Console)
   ------------------------------------------------------------
   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {

       function signedIn() { return request.auth != null; }
       function isSelf(uid) { return signedIn() && request.auth.uid == uid; }
       function role() {
         return get(/databases/$(database)/documents/users/$(request.auth.uid)).data.role;
       }
       function isAdmin() {
         return signedIn() && role() in ['admin','superadmin'];
       }
       function isStaff() {
         return signedIn() && role() in ['admin','superadmin','finance','moderator','support','analyst'];
       }

       // users: chỉ đọc/sửa chính mình, không tự đổi role
       match /users/{uid} {
         allow read: if isSelf(uid) || isStaff();
         allow create: if isSelf(uid);
         allow update: if isSelf(uid)
           && !request.resource.data.diff(resource.data).affectedKeys()
                .hasAny(['role','status','createdAt']);
         allow delete: if isAdmin();
       }

       // wallets: client chỉ đọc. Ghi qua Cloud Functions (Admin SDK).
       match /wallets/{uid} {
         allow read: if isSelf(uid) || isStaff();
         allow write: if false;
       }

       // transactions: immutable ledger. Chỉ đọc.
       match /transactions/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow write: if false;
       }

       // withdrawals: user tạo yêu cầu, chỉ staff đổi status
       match /withdrawals/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow create: if signedIn()
           && request.resource.data.userId == request.auth.uid
           && request.resource.data.status == 'pending'
           && request.resource.data.amount is number
           && request.resource.data.amount >= 50000;
         allow update, delete: if isStaff();
       }

       // shortlinks
       match /shortlinks/{id} {
         allow read: if true; // dùng cho route /s/:slug
         allow create: if signedIn()
           && request.resource.data.userId == request.auth.uid;
         allow update, delete: if signedIn()
           && resource.data.userId == request.auth.uid;
       }

       // shortlinkViews: chỉ ghi server-side
       match /shortlinkViews/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow write: if false;
       }

       // networks / rates: public read, admin write
       match /networks/{id} {
         allow read: if true;
         allow write: if isAdmin();
       }
       match /rateHistory/{id} {
         allow read: if true;
         allow create: if isAdmin();
         allow update, delete: if false; // immutable
       }

       // creator campaigns / submissions
       match /creatorCampaigns/{id} {
         allow read: if true;
         allow write: if isAdmin();
       }
       match /creatorSubmissions/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow create: if signedIn()
           && request.resource.data.userId == request.auth.uid
           && request.resource.data.status == 'pending';
         allow update, delete: if isStaff();
       }

       // fraud events, audit logs: chỉ staff
       match /fraudEvents/{id} {
         allow read: if isStaff();
         allow write: if false;
       }
       match /auditLogs/{id} {
         allow read: if isStaff();
         allow create: if isStaff();
         allow update, delete: if false;
       }

       // notifications
       match /notifications/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow write: if isStaff();
       }

       // support tickets
       match /supportTickets/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow create: if signedIn()
           && request.resource.data.userId == request.auth.uid;
         allow update, delete: if isStaff();
       }

       // referrals
       match /referrals/{id} {
         allow read: if signedIn()
           && (resource.data.userId == request.auth.uid || isStaff());
         allow write: if isStaff();
       }

       // settings: public read, admin write
       match /settings/{id} {
         allow read: if true;
         allow write: if isAdmin();
       }
     }
   }
   ============================================================ */

</script>
</body>
