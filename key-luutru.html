<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Key - VeloxKey</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            darkBg: '#121212',
            darkCard: '#1E1E1E',
            darkBorder: '#2A2A2A',
            accentGreen: '#22C55E'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #121212;
      color: #E5E7EB;
    }
    input, textarea, select, button {
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center border-b border-darkBorder pb-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          <svg class="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
          Quản Lý Key Game & License
        </h1>
        <p class="text-xs text-gray-400 mt-1">Firebase Project: <span class="text-green-400 font-mono">quocdat-396fe</span></p>
      </div>
      <div id="statusBadge" class="text-xs px-3 py-1 rounded-full bg-gray-800 text-gray-400 border border-darkBorder">
        Đang kết nối...
      </div>
    </div>

    <!-- Ô Nhập / Dán Key Hàng Loạt -->
    <div class="bg-darkCard p-6 rounded-2xl border border-darkBorder space-y-4 shadow-lg">
      <div class="flex justify-between items-center">
        <h2 class="text-base font-semibold text-white">Thêm Key Mới (Dán đơn lẻ hoặc dán hàng loạt)</h2>
        <span class="text-xs text-gray-400">Hỗ trợ nhận diện định dạng từ thông báo</span>
      </div>

      <div class="space-y-3">
        <textarea id="rawKeyInput" rows="4" class="w-full bg-[#181818] border border-darkBorder rounded-xl p-4 text-sm font-mono text-gray-200 focus:border-green-500 transition placeholder-gray-500" placeholder="Dán nội dung dạng:&#10;key: ame16106LTGLU&#10;game: AOV CHẤP TỐ&#10;thời gian: 30 ngày&#10;&#10;Hoặc dán nhiều key mỗi dòng 1 key..."></textarea>
        
        <!-- Các trường bổ sung nếu dán key nhanh -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs text-gray-400 mb-1">Tên Game / Sản Phẩm (Mặc định nếu trong text không có)</label>
            <input type="text" id="defaultGameInput" placeholder="VD: AOV CHẤP TỐ, PUBG..." class="w-full bg-[#181818] border border-darkBorder rounded-xl p-3 text-sm text-gray-200 focus:border-green-500">
          </div>
          <div>
            <label class="block text-xs text-gray-400 mb-1">Thời Gian (Mặc định)</label>
            <input type="text" id="defaultDurationInput" placeholder="VD: 30 ngày, vĩnh viễn..." class="w-full bg-[#181818] border border-darkBorder rounded-xl p-3 text-sm text-gray-200 focus:border-green-500">
          </div>
        </div>

        <button onclick="handleSaveKeys()" id="btnSave" class="w-full bg-green-600 hover:bg-green-500 text-white font-semibold py-3 rounded-xl transition flex justify-center items-center gap-2">
          <span>Lưu Lưu Trữ Key Vào Firebase</span>
        </button>
      </div>
    </div>

    <!-- Bảng Danh Sách Key -->
    <div class="bg-darkCard p-6 rounded-2xl border border-darkBorder space-y-4 shadow-lg">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div class="flex items-center gap-3">
          <h2 class="text-base font-semibold text-white">Danh Sách Key Đã Lưu</h2>
          <span id="keyCountBadge" class="text-xs bg-green-950 text-green-400 border border-green-800 px-2.5 py-0.5 rounded-full font-mono">0 keys</span>
        </div>

        <!-- Công cụ Lọc & Tìm kiếm -->
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <input type="text" id="searchInput" oninput="renderKeys()" placeholder="Tìm key hoặc tên game..." class="bg-[#181818] border border-darkBorder rounded-xl px-3 py-2 text-xs w-full sm:w-48 text-gray-200 focus:border-green-500">
          <button onclick="copyAllFilteredKeys()" class="px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 rounded-xl text-xs font-medium border border-darkBorder whitespace-nowrap">
            Copy TẤT CẢ Key
          </button>
        </div>
      </div>

      <!-- Danh sách -->
      <div id="keyList" class="space-y-3 pt-2">
        <div class="text-center py-8 text-xs text-gray-500">Đang tải danh sách key từ Cloud Firestore...</div>
      </div>
    </div>

  </div>

  <!-- Firebase Script Import (ES Module) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Cấu hình Firebase dự án quocdat-396fe
    const firebaseConfig = {
      apiKey: "AIzaSyAUuV5euNNLHE2Cf6tXzUHV-ChKwNF593Y",
      authDomain: "quocdat-396fe.firebaseapp.com",
      databaseURL: "https://quocdat-396fe-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "quocdat-396fe",
      storageBucket: "quocdat-396fe.firebasestorage.app",
      messagingSenderId: "685476439350",
      appId: "1:685476439350:web:949054ecba7f0a0c383f97"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const keysCollection = collection(db, "game_keys");

    let allKeysData = [];

    // Lắng nghe dữ liệu Realtime
    const q = query(keysCollection, orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      document.getElementById("statusBadge").textContent = "Đã kết nối Firebase";
      document.getElementById("statusBadge").className = "text-xs px-3 py-1 rounded-full bg-green-950 text-green-400 border border-green-800";
      
      allKeysData = [];
      snapshot.forEach((doc) => {
        allKeysData.push({ id: doc.id, ...doc.data() });
      });

      renderKeys();
    }, (error) => {
      console.error(error);
      document.getElementById("statusBadge").textContent = "Lỗi kết nối";
      document.getElementById("statusBadge").className = "text-xs px-3 py-1 rounded-full bg-red-950 text-red-400 border border-red-800";
    });

    // Xử lý tách chuỗi văn bản khi dán
    window.handleSaveKeys = async function() {
      const rawText = document.getElementById("rawKeyInput").value.trim();
      const defaultGame = document.getElementById("defaultGameInput").value.trim() || "Chưa phân loại";
      const defaultDuration = document.getElementById("defaultDurationInput").value.trim() || "Không xác định";

      if (!rawText) {
        alert("Vui lòng dán hoặc nhập nội dung Key!");
        return;
      }

      const btnSave = document.getElementById("btnSave");
      btnSave.disabled = true;
      btnSave.innerText = "Đang lưu...";

      try {
        // Phân tích văn bản
        const keyEntries = parseRawKeyInput(rawText, defaultGame, defaultDuration);

        for (const item of keyEntries) {
          await addDoc(keysCollection, {
            key: item.key,
            game: item.game,
            duration: item.duration,
            status: "active", // active hoặc sold
            createdAt: serverTimestamp()
          });
        }

        document.getElementById("rawKeyInput").value = "";
        alert(`Đã lưu thành công ${keyEntries.length} key!`);
      } catch (err) {
        alert("Lỗi khi lưu key: " + err.message);
      } finally {
        btnSave.disabled = false;
        btnSave.innerText = "Lưu Lưu Trữ Key Vào Firebase";
      }
    };

    // Hàm bóc tách nội dung từ text dán vào
    function parseRawKeyInput(text, defaultGame, defaultDuration) {
      const results = [];
      
      // Kiểm tra nếu text có dạng: key: xxx \n game: yyy \n thời gian: zzz
      if (text.toLowerCase().includes("key:")) {
        const blocks = text.split(/(?=key:)/i);
        blocks.forEach(block => {
          if (!block.trim()) return;
          
          const keyMatch = block.match(/key:\s*([^\n\r]+)/i);
          const gameMatch = block.match(/game:\s*([^\n\r]+)/i);
          const timeMatch = block.match(/(?:thời gian|time):\s*([^\n\r]+)/i);

          if (keyMatch && keyMatch[1].trim()) {
            results.push({
              key: keyMatch[1].trim(),
              game: gameMatch ? gameMatch[1].trim() : defaultGame,
              duration: timeMatch ? timeMatch[1].trim() : defaultDuration
            });
          }
        });
      } else {
        // Nếu dán danh sách mỗi dòng 1 key
        const lines = text.split(/\r?\n/);
        lines.forEach(line => {
          const trimmed = line.trim();
          if (trimmed) {
            results.push({
              key: trimmed,
              game: defaultGame,
              duration: defaultDuration
            });
          }
        });
      }

      return results;
    }

    // Hiển thị danh sách Key
    window.renderKeys = function() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const container = document.getElementById("keyList");

      const filtered = allKeysData.filter(item => 
        (item.key && item.key.toLowerCase().includes(search)) ||
        (item.game && item.game.toLowerCase().includes(search))
      );

      document.getElementById("keyCountBadge").textContent = `${filtered.length} keys`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-gray-500">Không tìm thấy key nào.</div>`;
        return;
      }

      let html = "";
      filtered.forEach(item => {
        const isSold = item.status === "sold";
        html += `
          <div class="bg-[#181818] p-4 rounded-xl border border-darkBorder flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-2">
                <span class="font-mono text-sm font-bold text-white selection:bg-green-500 selection:text-black">${item.key}</span>
                <span class="text-[10px] px-2 py-0.5 rounded ${isSold ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-green-950 text-green-400 border border-green-800'}">
                  ${isSold ? 'Đã dùng / Đã bán' : 'Sẵn sàng'}
                </span>
              </div>
              <div class="text-xs text-gray-400 flex items-center gap-3">
                <span>Game: <strong class="text-gray-200">${item.game || 'N/A'}</strong></span>
                <span>Thời gian: <strong class="text-gray-200">${item.duration || 'N/A'}</strong></span>
              </div>
            </div>

            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
              <button onclick="copyToClipboard('${item.key}')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-200 rounded-lg transition border border-darkBorder">
                Copy Key
              </button>
              <button onclick="copyFullFormat('${item.key}', '${item.game}', '${item.duration}')" class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs font-medium text-gray-200 rounded-lg transition border border-darkBorder">
                Copy Hết
              </button>
              <button onclick="toggleKeyStatus('${item.id}', '${item.status}')" class="px-2.5 py-1.5 bg-gray-800 hover:bg-gray-700 text-xs text-gray-400 rounded-lg transition border border-darkBorder" title="Đổi trạng thái">
                ${isSold ? 'Mở lại' : 'Đánh dấu bán'}
              </button>
              <button onclick="deleteKeyDoc('${item.id}')" class="px-2.5 py-1.5 bg-red-950 hover:bg-red-900 text-red-400 text-xs rounded-lg transition border border-red-900">
                Xóa
              </button>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    };

    // Copy Key đơn lẻ
    window.copyToClipboard = function(text) {
      navigator.clipboard.writeText(text);
      alert("Đã copy key: " + text);
    };

    // Copy đầy đủ dạng mẫu thông báo
    window.copyFullFormat = function(key, game, duration) {
      const full = `key: ${key}\ngame: ${game}\nthời gian: ${duration}`;
      navigator.clipboard.writeText(full);
      alert("Đã copy đầy đủ thông tin key!");
    };

    // Copy tất cả key hiện đang hiển thị
    window.copyAllFilteredKeys = function() {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allKeysData.filter(item => 
        (item.key && item.key.toLowerCase().includes(search)) ||
        (item.game && item.game.toLowerCase().includes(search))
      );

      if (filtered.length === 0) {
        alert("Không có key nào để copy!");
        return;
      }

      const allKeysText = filtered.map(i => i.key).join("\n");
      navigator.clipboard.writeText(allKeysText);
      alert(`Đã copy ${filtered.length} key vào khay nhớ tạm!`);
    };

    // Đổi trạng thái Key
    window.toggleKeyStatus = async function(docId, currentStatus) {
      const newStatus = currentStatus === "sold" ? "active" : "sold";
      await updateDoc(doc(db, "game_keys", docId), { status: newStatus });
    };

    // Xóa Key
    window.deleteKeyDoc = async function(docId) {
      if (confirm("Bạn có chắc chắn muốn xóa key này?")) {
        await deleteDoc(doc(db, "game_keys", docId));
      }
    };
  </script>
</body>
</html>
